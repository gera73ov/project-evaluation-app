  - {who: admin (support_session), action: PATCH O/R/P листа, expect: 403, by: [R-SUPPORT]}
  - {who: presale_head (не участник), action: GET /api/v1/projects/42/money, expect: 200, by: [M3.3-20, R-PRESALE-HEAD]}
  - {who: presale_head (не участник), action: PATCH O/R/P листа, expect: 403, by: [M3.3-23]}
  - {who: security_auditor, action: GET /api/v1/projects/42/tree, expect: 404, by: [M3.3-22, R-OBJECT-CHAIN]}
  - {who: superadmin, action: GET /api/v1/projects/42/tree, expect: 404, by: [M3.3-22, R-OBJECT-CHAIN]}
