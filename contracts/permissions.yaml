# ---------------------------------------------------------------------------
# 4. Правила вычисления (порядок проверки — permissions.md, раздел «Алгоритм»)
# ---------------------------------------------------------------------------
rules:
  - id: R-DENY-DEFAULT
    spec: [SEC-AUTHZ-02]
    rule: Эндпоинт и WS-команда без объявленного права не регистрируются; право, которого нет в выдаче, запрещено.
  - id: R-OBJECT-CHAIN
    spec: [SEC-AUTHZ-03]
    rule: >-
      Доступ к объекту проекта проверяется по цепочке «объект → проект → членство или контекст
      (support_session, any_project) → роль → дисциплина → статус (3.4)».
      Нет членства и контекста — 404 NOT_FOUND (не 403). Есть членство или контекст, но нет права — 403 FORBIDDEN.
  - id: R-SUM
    spec: [BR-ROLE-01]
    rule: >-
      Права нескольких системных и проектных ролей суммируются, КРОМЕ денег: money.*, notes.*,
      export.money, portfolio.* дают только выдачи project_moderator, project_presale и
      presale_head. Права системной роли admin никогда не включают деньги, в том числе в
      support_session; администратор видит деньги только как участник проекта (BR-ADM-03).
  - id: R-SESSION-TIMEOUT
    spec: [BR-ROLE-01, FR-SESS-02]
    rule: При нескольких ролях действует самый короткий тайм-аут бездействия.
  - id: R-COMPAT
    spec: [BR-ROLE-02]
    rule: >-
      superadmin несовместим с любой другой ролью и не может быть участником проекта;
      security_auditor совместим только с user. Нарушение — 409 ROLE_INCOMPATIBLE при выдаче роли или назначении.
    incompatible:
      superadmin: [admin, moderator, presale, presale_head, security_auditor, project_member]
      security_auditor: [superadmin, admin, moderator, presale, presale_head, project_member]
    note: >-
      Запрет участия аудитора ИБ в проектах следует из 3.2 («не видит проекты, деньги,
      пользователей … и настройки»).
  - id: R-SUPERADMIN-COUNT
    spec: [BR-ROLE-03]
    rule: Активных суперадминистраторов 2–3; заблокировать или разжаловать последнего — 409 LAST_SUPERADMIN; создать четвёртого — 409.
  - id: R-MOD-OVER-EXPERT
    spec: [BR-ROLE-04]
    rule: Модератор и эксперт одного проекта получает права модератора (выдачи суммируются, scope any покрывает own_discipline).
  - id: R-LAST-MODERATOR
    spec: [BR-ROLE-07]
    rule: Удалить последнего модератора проекта — 409 LAST_MODERATOR.
  - id: R-MOD-ROLE-REMOVED
    spec: [BR-ROLE-08]
    rule: Снятие системной роли moderator не отнимает project_moderator в существующих проектах, но отнимает project.create и project.copy.
  - id: R-EXCLUDED
    spec: [BR-ROLE-06, FR-SESS-05]
    rule: Исключённый участник сразу теряет context member, в том числе для архива и как источник branch.copy_from; открытые WS получают access.revoked.
  - id: R-TOTP-GATE
    spec: [FR-2FA-05, SEC-AUTHZ-04, R-05]
    rule: >-
      Права с totp_gate действуют, только если в текущей сессии пройден TOTP
      (sessions.mfa_passed). Иначе денежные поля и заметки отсутствуют в ответах и событиях
      (нет ключа, не null), денежные эндпоинты отвечают 403 TOTP_REQUIRED, подписка на
      project:{id}:money и project:{id}:notes не выдаётся.
  - id: R-MONEY-FIELDS
    spec: [SEC-AUTHZ-04, TC-SEC-03]
    rule: >-
      В ответах прав с money_fields денежные ключи (rate, cost, currency, exchange_rate, money,
      vat, contract_amount, quote_rub, quote_cur, cost_rub) присутствуют только при действующем
      money.read; иначе ключа нет.
  - id: R-STEP-UP
    spec: [SEC-AUTH-05]
    rule: Права с step_up требуют step-up не старше 5 минут (sessions.step_up_until); иначе 403 STEP_UP_REQUIRED.
  - id: R-NETWORK
    spec: [FR-SA-06]
    rule: >-
      Если задан security.admin_networks, права с network, вход суперадминистраторов и их
      WS-подключения доступны только из перечисленных сетей; из других — 404.
  - id: R-PRE-MFA
    spec: [FR-2FA-04]
    rule: Сессия до обязательного подключения TOTP получает только session.pre_mfa; всё остальное — 403 TOTP_ENROLL_REQUIRED.
  - id: R-PASSWORD-EXPIRED
    spec: [FR-AUTH-LOC-02]
    rule: >-
      Сессия после входа с истёкшим паролем (срок security.password_policy.expiry_days, только
      локальные учётки) получает только session.password_change; всё остальное, включая
      session.pre_mfa, — 403 PASSWORD_CHANGE_REQUIRED. Смена пароля снимает ограничение и меняет
      идентификатор сессии; если TOTP обязателен и не подключён, дальше действует R-PRE-MFA (CR-003).
  - id: R-SUPPORT
    spec: [FR-ADM-06, Q-15]
    rule: >-
      Контекст support_session существует, пока support_sessions.expires_at > now (≤ 60 мин);
      даёт только права read_only из выдачи admin, без money_fields и без заметок; любой запрос
      на запись — 403. Открытие — аудит с причиной и уведомление модераторам в любом статусе.
  - id: R-PRESALE-HEAD
    spec: [FR-PORT-01, FR-PORT-03, R-02, R-06]
    rule: >-
      Контекст any_project даёт руководителю пресейла чтение любого проекта с деньгами и
      notes.read; первое открытие каждого чужого проекта за сессию — событие аудита. Писать
      заметки и править может, только став модератором проекта (тогда действует member).
      join_as_moderator добавляет только себя; в статусе archived — 409 PROJECT_STATUS_CONFLICT.
  - id: R-ROLE-GRANT-LIMITS
    spec: [SEC-AUTHZ-06, FR-AUTH-AD-07]
    rule: >-
      Администратор выдаёт и снимает только moderator, presale, presale_head; admin и
      security_auditor — только суперадминистратор; никто не меняет свои системные роли (403).
      При включённом сопоставлении групп AD ручная выдача moderator и presale AD-пользователям
      недоступна (409 ROLE_INCOMPATIBLE). Назначение администратором себя или созданной им учётки в проект
      разрешено и пишется в аудит с пометкой added_by_admin_self (BR-ADM-03).
  - id: R-STATUS
    spec: [3.4]
    rule: >-
      Помимо выдачи право должно быть разрешено всеми строками matrix_3_4 (и derived_status_gates),
      где оно перечислено, для субъекта из applies_to; иначе 409 PROJECT_STATUS_CONFLICT. Права, которых нет ни в одной строке,
      от статуса проекта не зависят.

# Ограничения по статусу, которых нет в таблице 3.4 явно, но которые следуют из текста SPEC
derived_status_gates:
  - id: D-01
    spec: [4.2]
    reason: >-
      Таблица 4.2: «Завершена — только чтение для всех; модератор может переоткрыть; пресейл и
      модератор продолжают вести вопросы заказчику и «Результат пресейла»»; «Архив — только
      чтение и копирование веток». Загрузка документов и закрытые заметки в этот перечень не входят.
    permissions: [docs.write, docs.restore, notes.write]
    statuses: {preparation: allow, estimation: allow, consolidation: allow, completed: deny,
               archived: deny}
  - id: D-02
    spec: [3.4 (строка «Уведомления о событиях оценки»), 4.2]
    reason: Письмо «Напомнить не начавшим» — уведомление о событии оценки; в «Подготовке» эксперты проект не видят, в «Завершена» и «Архиве» такие письма не отправляются.
    permissions: [team.remind]
    statuses: {preparation: deny, estimation: allow, consolidation: allow, completed: deny,
               archived: deny}
  - id: D-03
    spec: [FR-SNAP-02, 4.2]
    reason: Пометка снимка «ошибочный» — запись; в «Архиве» только чтение. Строка 3.4 «Снимок» распространена и на неё.
    permissions: [snapshot.invalidate]
    statuses: {preparation: deny, estimation: allow, consolidation: allow, completed: allow,
               archived: deny}
  - id: D-04
    spec: [FR-PRJ-05, 4.2]
    reason: Переходы статуса разрешены только по стрелкам диаграммы 4.2; остальные — 409 INVALID_TRANSITION.
    permissions: [project.status]
    transitions:
      preparation: [estimation]
      estimation: [consolidation, archived]
      consolidation: [estimation, completed]
      completed: [estimation, archived]
      archived: [completed]

