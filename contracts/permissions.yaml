# contracts/permissions.yaml — матрица прав как данные (SEC-001).
# Владелец: трек SEC. Потребители: CORE, ADM, AUTH, RT, EXP, QA, FE (PLAN.md раздел 6).
# Источник правды — SPEC v0.5, разделы 3.1–3.4, 12.4, FR-2FA-05, FR-ADM-06, FR-PORT-01..03.
# Пояснения и правила вычисления — contracts/permissions.md.
# До вехи M0 файл меняет трек SEC обычным PR; после M0 — только через CR (contracts/README.md).
# Разделы 6–7 (матрицы 3.3 и 3.4) сверяются с SPEC тестом
# backend/tests/unit/sec/test_permissions_contract.py: текст ячеек должен совпадать дословно.

version: 1.0.0
status: approved  # PM-001, веха M0 (05.11.2026); дальше только через CR
spec: SPEC.md v0.5

# ---------------------------------------------------------------------------
# 1. Субъекты: системные роли, проектные роли и контексты доступа (3.1, 14.2)
# ---------------------------------------------------------------------------
system_roles:
  superadmin: {title: Суперадминистратор, db: superadmin}
  admin: {title: Администратор, db: admin}
  moderator: {title: Модератор (право создавать проекты), db: moderator}
  presale: {title: Пресейл, db: presale}
  presale_head: {title: Руководитель пресейла, db: presale_head}
  security_auditor: {title: Аудитор ИБ, db: security_auditor}
  user: {title: Пользователь, db: null, note: есть у всех, в user_roles не хранится}

project_roles:
  project_moderator: {title: Модератор проекта, db: "project_members.role = 'moderator'"}
  expert: {title: Эксперт дисциплины, db: "project_members.role = 'expert'"}
  reviewer:
    title: Ревьюер дисциплины
    db: "project_members.role = 'expert' AND is_reviewer"
    note: признак эксперта, а не отдельная роль; получает все права эксперта плюс review.mark
  project_presale: {title: Пресейл проекта, db: "project_members.role = 'presale'"}

# Столбцы матрицы 3.3 слева направо
matrix_subjects: [superadmin, admin, security_auditor, presale_head, project_moderator, expert,
                  reviewer, project_presale]

# Обобщённый субъект в таблице 3.4: любой участник проекта (любая проектная роль)
subject_groups:
  project_member: [project_moderator, expert, reviewer, project_presale]

# Контекст, в котором действует выдача права (grant.context)
contexts:
  global: Не привязано к проекту (админки, профиль, справочники)
  member: Пользователь — участник проекта (строка project_members, кроме исключённых)
  support_session: >-
    Администратор открыл проект в режиме поддержки (support_sessions, не дольше 60 минут,
    причина 10–500 символов, FR-ADM-06). Только чтение, без денег и без закрытых заметок.
  any_project: >-
    Руководитель пресейла открывает любой проект без членства (FR-PORT-01, R-02): чтение со
    всеми деньгами; первое открытие каждого чужого проекта за сессию пишется в аудит
    (presale_head.project_opened, contracts/audit-events.yaml).

# Область выдачи (grant.scope) — проверяется на объекте по цепочке SEC-AUTHZ-03
scopes:
  any: Любой объект проекта
  own_discipline: >-
    Узел, ветка или лист дисциплины, на которую пользователь назначен экспертом (во всех фазах).
    Для переноса — и источник, и цель в своей дисциплине.
  own_project: Только проект, где пользователь — модератор
  author: Пользователь — автор объекта (сообщения, вопроса)
  author_or_addressee: Автор вопроса или любой из его адресатов (FR-DISC-05)
  documents_only: В корзине — только удалённые документы заказчика (GAP-06)
  all_projects: Все проекты приложения
  admin_audit_categories: Только категории аудита «Справочники» и «Пользователи и роли» (SEC-AUD-06)
  all: Без ограничения области

# ---------------------------------------------------------------------------
# 2. Каталог прав. Коды без суффикса области: область задаёт выдача (раздел 3).
#    x-permission в contracts/openapi.yaml ссылается на эти коды (SEC-AUTHZ-02).
#    Флаги:
#      totp_gate     — действует только при пройденном в сессии TOTP (FR-2FA-05, R-05),
#                      иначе денежные поля отсутствуют, эндпоинт → 403 TOTP_REQUIRED;
#      step_up       — нужен свежий step-up: пароль + TOTP, действует 5 минут (SEC-AUTH-05);
#      network       — путь ограничен списком security.admin_networks, иначе 404 (FR-SA-06);
#      money_fields  — ответ содержит денежные поля только при money.read (SEC-AUTHZ-04);
#      read_only     — право чтения: допустимо в режиме поддержки и у руководителя пресейла.
# ---------------------------------------------------------------------------
permissions:
  # --- служебные псевдоправа: эндпоинты без роли тоже объявляют право (TC-SEC-01) ---
  public:
    title: Без аутентификации
    spec: [15.2, FR-AUTH-LOC-03]
    endpoints:
      - "POST /auth/login"
      - "POST /auth/password/forgot"
  token.login_step:
    title: Временный токен шага TOTP (5 минут) после верного пароля
    spec: [7.2, FR-2FA-01]
    endpoints:
      - "POST /auth/totp"
  token.activation:
    title: Одноразовый токен из ссылки активации или сброса пароля
    spec: [FR-SA-01, FR-AUTH-LOC-01, FR-AUTH-LOC-03, SEC-AUTH-03]
    endpoints:
      - "POST /auth/activate"
      - "POST /auth/password/reset"
  session.pre_mfa:
    title: Сессия до обязательного подключения TOTP (не дольше 15 минут)
    spec: [FR-2FA-04]
    endpoints:
      - "POST /auth/totp/enroll"
      - "POST /auth/totp/enroll/confirm"
      - "POST /auth/logout"
  session.password_change:
    title: Сессия с истёкшим паролем (не дольше 15 минут) — только смена пароля и выход
    spec: [FR-AUTH-LOC-02]
    endpoints:
      - "POST /me/password"
      - "POST /auth/logout"
  authenticated:
    title: Любой вошедший пользователь (сессия полностью установлена)
    spec: [15.2]
    endpoints:
      - "POST /auth/logout"
      - "POST /auth/step-up"
      - "GET /me"
      - "PATCH /me"
      - "GET /me/sessions"
      - "DELETE /me/sessions"
      - "POST /me/password"
      - "POST /me/totp"
      - "POST /me/backup-codes"
      - "GET /me/notification-settings"
      - "PUT /me/notification-settings"
      - "GET /notifications"
      - "POST /notifications/read"
      - "WS /ws"
  me.totp.disable:
    title: Отключить свой TOTP
    spec: [15.2]
    step_up: true
    endpoints:
      - "DELETE /me/totp"

  # --- система (суперадминистратор) ---
  system.setup:
    title: Мастер первичной настройки (только до его завершения)
    spec: [7.1, FR-SA-02]
    network: true
    endpoints:
      - "GET /system/setup/{step}"
      - "POST /system/setup/{step}"
  system.health.read:
    title: Состояние системы
    spec: [FR-SA-07]
    network: true
    endpoints:
      - "GET /system/health"
  system.settings.read:
    title: Чтение настроек системы
    spec: [7.1, 14.2 system_settings]
    network: true
    endpoints:
      - "GET /system/settings/{section}"
  system.settings.write:
    title: Политики безопасности, SMTP, сети, сроки хранения, SIEM, адрес и часовой пояс
    spec: [3.3, SEC-AUTH-05, SEC-AUTH-07]
    network: true
    step_up: true
    endpoints:
      - "PUT /system/settings/{section}"
  system.auth.test:
    title: Проверить подключение и вход AD (без сохранения)
    spec: [FR-AUTH-AD-03]
    network: true
    endpoints:
      - "POST /system/auth/ad/test-connection"
      - "POST /system/auth/ad/test-login"
  system.auth.manage:
    title: Способ аутентификации и параметры AD, переход «Приложение → AD»
    spec: [3.3, FR-AUTH-SW-01, SEC-AUTH-05]
    network: true
    step_up: true
    endpoints:
      - "PUT /system/settings/auth"
      - "POST /system/auth/switch-mode"
      - "POST /system/auth/switch-mode/resolve"
  system.admins.manage:
    title: Создать, заблокировать, разжаловать администратора и суперадминистратора; выдать и снять роль «Аудитор ИБ»
    spec: [3.3, FR-SA-05, BR-ROLE-03, SEC-AUTHZ-06, SEC-AUTH-05]
    network: true
    step_up: true
    endpoints:
      - "GET /system/admins"
      - "POST /system/admins"
      - "PATCH /system/admins/{id}"
      - "DELETE /system/admins/{id}"
  system.users.reset_credentials:
    title: Сбросить пароль или TOTP администратору или суперадминистратору
    spec: [FR-2FA-03, Q-22, SEC-AUTH-05]
    network: true
    step_up: true
    endpoints:
      - "POST /system/users/{id}/reset-password"
      - "POST /system/users/{id}/reset-totp"
  system.users.anonymize:
    title: Анонимизировать заблокированного пользователя
    spec: [SEC-PD-03, SEC-AUTH-05]
    network: true
    step_up: true
    endpoints:
      - "POST /system/users/{id}/anonymize"
  registry.read:
    title: Реестр всех проектов без денег (название, модератор, статус, даты)
    spec: [3.2, 3.3, 7.5]
    endpoints:
      - "GET /system/projects"
      - "GET /admin/projects"
  audit.read.all:
    title: Весь журнал аудита, включая действия суперадминистраторов
    spec: [SEC-AUD-06, Q-27]
    endpoints:
      - "GET /system/audit"
  audit.read.admin_categories:
    title: Журнал аудита — только категории «Справочники» и «Пользователи и роли»
    spec: [SEC-AUD-06]
    endpoints:
      - "GET /system/audit"
  audit.export:
    title: Выгрузка журнала аудита в CSV с грифом
    spec: [SEC-AUD-06, FR-EXP-06, SEC-AUTH-05]
    step_up: true
    endpoints:
      - "POST /system/audit/export"

  # --- администратор ---
  dict.read:
    title: Читать справочники (фазы, дисциплины, типы, профили, пороги, календарь, причины проигрыша, метки, валюты, НДС)
    spec: [3.3, 7.5]
    endpoints:
      - "GET /admin/phases"
      - "GET /admin/disciplines"
      - "GET /admin/node-types"
      - "GET /admin/profiles"
      - "GET /admin/ratios"
      - "GET /admin/tags"
      - "GET /admin/currencies"
      - "GET /admin/vat-rates"
      - "GET /admin/loss-reasons"
      - "GET /admin/calendar"
      - "GET /admin/method-settings"  # GAP-13
  dict.write:
    title: Вести справочники и «Пороги и проценты» (method.*)
    spec: [3.3, 7.5, BR-ADM-01]
    endpoints:
      - "POST|PUT|PATCH|DELETE /admin/phases"
      - "/admin/disciplines"
      - "/admin/node-types"
      - "/admin/profiles"
      - "/admin/ratios"
      - "/admin/tags"
      - "/admin/currencies"
      - "/admin/vat-rates"
      - "/admin/loss-reasons"
      - "/admin/calendar"
      - "PUT /admin/method-settings"  # GAP-13
  proposed_types.manage:
    title: Принять, объединить, отклонить предложенные локальные типы
    spec: [7.5, FR-TREE-03]
    endpoints:
      - "GET /admin/proposed-types"
      - "POST /admin/proposed-types/{id}/accept"
      - "POST /admin/proposed-types/{id}/merge"
      - "POST /admin/proposed-types/{id}/reject"
  users.read:
    title: Список и карточка пользователей
    spec: [7.5]
    endpoints:
      - "GET /admin/users"
      - "GET /admin/users/{id}"
  users.manage:
    title: Создать, изменить, заблокировать и разблокировать пользователя
    spec: [3.3, 7.5, FR-AUTH-LOC-01]
    endpoints:
      - "POST /admin/users"
      - "PATCH /admin/users/{id}"
      - "POST /admin/users/{id}/block"
      - "POST /admin/users/{id}/unblock"
  users.roles.grant:
    title: Выдать и снять роли «Модератор», «Пресейл», «Руководитель пресейла»
    spec: [3.3, SEC-AUTHZ-06, FR-AUTH-AD-07]
    endpoints:
      - "PATCH /admin/users/{id}"
  users.reset_credentials:
    title: Сбросить пароль или TOTP пользователю
    spec: [FR-2FA-03, SEC-AUTH-05]
    step_up: true
    endpoints:
      - "POST /admin/users/{id}/reset-password"
      - "POST /admin/users/{id}/reset-totp"
  users.replace_everywhere:
    title: Заменить участника во всех активных проектах
    spec: [FR-ADM-05, Q-29]
    endpoints:
      - "POST /admin/users/{id}/replace"
  ad.search:
    title: Поиск в каталоге AD и заведение пользователя заранее
    spec: [FR-AUTH-AD-10, Q-16]
    endpoints:
      - "GET /admin/ad/search"
  project.moderators.transfer:
    title: Передать проект другому модератору или добавить модератора (из реестра)
    spec: [3.3, BR-PRJ-07]
    endpoints:
      - "POST /admin/projects/{id}/moderators"
  support.open:
    title: Открыть проект в режиме поддержки (с причиной)
    spec: [FR-ADM-06, Q-15]
    endpoints:
      - "POST /admin/projects/{id}/support-session"

  # --- руководитель пресейла ---
  portfolio.read:
    title: Реестр всех проектов с деньгами и сводка по портфелю
    spec: [FR-PORT-01, FR-PORT-02, Q-31]
    totp_gate: true
    endpoints:
      - "GET /portfolio/projects"
      - "GET /portfolio/summary"
  portfolio.export:
    title: Выгрузка реестра и сводки в Excel
    spec: [FR-PORT-02, FR-EXP-06]
    totp_gate: true
    endpoints:
      - "POST /portfolio/export"
  project.join_as_moderator:
    title: «Стать модератором проекта» — только себя, статус не «Архив» (иначе 409)
    spec: [FR-PORT-03, R-06]
    endpoints:
      - "POST /projects/{id}/join-as-moderator"

  # --- проект: настройки и команда ---
  project.list_mine:
    title: Видеть проект в «Моих оценках»
    spec: [FR-HOME-01, 3.4]
    endpoints:
      - "GET /projects"
  project.create:
    title: Создать проект
    spec: [3.3, FR-HOME-03, FR-PRJ-05]
    endpoints:
      - "POST /projects"
  project.copy:
    title: Копировать проект (модератор проекта с системной ролью «Модератор»)
    spec: [FR-PRJ-02]
    endpoints:
      - "POST /projects/{id}/copy"
  project.read:
    title: Настройки проекта, команда, «Результат пресейла» (без суммы договора), состояние вида
    spec: [3.3, 11.6]
    read_only: true
    money_fields: true
    endpoints:
      - "GET /projects/{id}"
      - "GET /projects/{id}/members"
      - "GET /projects/{id}/outcome"
      - "GET /me/view-state/{project_id}"
      - "PUT /me/view-state/{project_id}"
  project.settings.write:
    title: Изменить настройки проекта (без денег)
    spec: [FR-PRJ-01, 11.6]
    endpoints:
      - "PATCH /projects/{id}"
  project.status:
    title: Сменить статус проекта, в том числе отменить и перевести в архив
    spec: [FR-PRJ-05, 4.2]
    endpoints:
      - "POST /projects/{id}/status"
  project.disciplines.add:
    title: Добавить дисциплину в проект
    spec: [FR-PRJ-04]
    endpoints:
      - "POST /projects/{id}/disciplines"
  team.write:
    title: Изменить команду, в том числе добавить модератора
    spec: [3.3, BR-ROLE-07]
    endpoints:
      - "PUT /projects/{id}/members"
      - "GET /projects/{id}/member-candidates"
  team.replace_member:
    title: Заменить заблокированного участника в проекте
    spec: [FR-ADM-05]
    endpoints:
      - "POST /projects/{id}/members/{user_id}/replace"
  project.ad_search:
    title: Найти человека в AD и назначить в проект (режим AD)
    spec: [FR-AUTH-AD-10]
    endpoints:
      - "GET /projects/{id}/ad-search"
  team.remind:
    title: «Напомнить не начавшим» (не чаще 1 раза в сутки, иначе 429)
    spec: [10.1, 11.8]
    endpoints:
      - "POST /projects/{id}/remind"
  outcome.write:
    title: Заполнить «Результат пресейла»
    spec: [BR-PRJ-05]
    endpoints:
      - "PUT /projects/{id}/outcome"
  money.read:
    title: Ставки, валюта, курс, НДС, сумма договора, стоимость и итоги в деньгах
    spec: [SEC-AUTHZ-04, BR-MONEY-01]
    totp_gate: true
    read_only: true
    endpoints:
      - "GET /projects/{id}/money"
  money.write:
    title: Изменить ставки, валюту, курс, НДС
    spec: [SEC-AUTHZ-04]
    totp_gate: true
    endpoints:
      - "PUT /projects/{id}/money"
  notes.read:
    title: Читать закрытые заметки
    spec: [FR-NOTE-01, SEC-AUTHZ-04]
    totp_gate: true
    read_only: true
    endpoints:
      - "GET /projects/{id}/notes"
  notes.write:
    title: Писать и править закрытые заметки
    spec: [FR-NOTE-01, SEC-AUTHZ-04]
    totp_gate: true
    endpoints:
      - "POST /projects/{id}/notes"
      - "PATCH /notes/{id}"
  docs.read:
    title: Список и скачивание документов заказчика (скачивание — в аудит)
    spec: [FR-DOC-01]
    read_only: true
    endpoints:
      - "GET /projects/{id}/documents"
      - "GET /documents/{id}/download"
  docs.write:
    title: Загрузить и удалить документ заказчика
    spec: [FR-DOC-01, SEC-WEB-10]
    endpoints:
      - "POST /projects/{id}/documents"
      - "DELETE /documents/{id}"
  docs.restore:
    title: Восстановить документ заказчика из корзины
    spec: [FR-DOC-01, GAP-06]
    endpoints:
      - "POST /documents/{id}/restore"
  journal.read:
    title: Журнал проекта (записи о деньгах — только с money.read)
    spec: [11.6, GAP-02]
    read_only: true
    money_fields: true
    endpoints:
      - "GET /projects/{id}/journal"

  # --- дерево ---
  tree.read:
    title: Дерево, изменения с версии, история узла, подписка WS на проект
    spec: [3.3, FR-TREE-25, FR-TREE-33, 15.4]
    read_only: true
    endpoints:
      - "GET /projects/{id}/tree"
      - "GET /projects/{id}/changes"
      - "GET /nodes/{id}/history"
      - "GET /projects/{id}/node-types"
      - "WS subscribe project:{id}"
  tree.write:
    title: Менять структуру и O/R/P/×N (создать, изменить, перенести внутри области, разбить, свернуть, дублировать, удалить в корзину, захват ячейки)
    spec: [3.3, SEC-AUTHZ-05, FR-TREE-20..25, FR-TREE-31]
    endpoints:
      - "POST /projects/{id}/nodes"
      - "PATCH /nodes/{id}"
      - "POST /nodes/{id}/move"
      - "POST /nodes/{id}/split"
      - "POST /nodes/{id}/collapse"
      - "POST /nodes/{id}/duplicate"
      - "DELETE /nodes/{id}"
      - "WS lock/unlock"
  tree.move.cross_branch:
    title: Перенести узел в другую ветку проекта (модератор)
    spec: [FR-TREE-23, BR-BR-02, SEC-AUTHZ-05]
    endpoints:
      - "POST /nodes/{id}/move"
  tree.lock.force:
    title: Перехватить чужой захват ячейки («Всё равно править»)
    spec: [FR-TREE-31]
    endpoints:
      - "WS lock {force: true}"
  comment.write:
    title: Комментарий листа и узла (строки с метками)
    spec: [3.3, 9.1, R-03, BR-BR-02]
    endpoints:
      - "PATCH /nodes/{id}"
  branch.profile.write:
    title: Профиль ветки дисциплины в проекте
    spec: [FR-TREE-04]
    endpoints:
      - "PATCH /projects/{id}/disciplines/{discipline_id}"
  node_type.create_local:
    title: Создать локальный тип узла
    spec: [FR-TREE-03]
    endpoints:
      - "POST /projects/{id}/node-types"
  branch.copy_from:
    title: Копировать ветку из другого проекта (в цель — по области; источник — только текущий участник)
    spec: [FR-PRJ-03, BR-ROLE-06]
    endpoints:
      - "POST /nodes/{id}/copy-from"
  branch.status.draft_done:
    title: Статус ветки «черновик / готово»
    spec: [3.3, BR-BR-01]
    endpoints:
      - "PUT /projects/{id}/branches/{phase}/{discipline}/status"
  branch.status.not_needed:
    title: Статус ветки «не нужно» и возврат из него
    spec: [3.3, 4.3]
    endpoints:
      - "PUT /projects/{id}/branches/{phase}/{discipline}/status"
  review.mark:
    title: Отметка «Проверено» (на своих листьях ревьюера — самопроверка)
    spec: [FR-REV-01, FR-REV-04, Q-33]
    endpoints:
      - "POST /nodes/{id}/review"
  trash.read:
    title: Корзина проекта
    spec: [FR-TREE-24, GAP-06]
    read_only: true
    endpoints:
      - "GET /projects/{id}/trash"
  trash.restore:
    title: Восстановить узлы из корзины
    spec: [FR-TREE-24]
    endpoints:
      - "POST /trash/{batch_id}/restore"

  # --- обсуждения и вопросы заказчику ---
  discussion.read:
    title: Читать обсуждения и вопросы проекта, автодополнение адресатов
    spec: [FR-DISC-08, Q-03, GAP-02]
    read_only: true
    endpoints:
      - "GET /projects/{id}/threads"
      - "GET /nodes/{id}/messages"
      - "GET /projects/{id}/members/suggest"
  discussion.write:
    title: Писать в обсуждениях; править и отзывать своё сообщение (FR-DISC-06)
    spec: [3.3, FR-DISC-02..06]
    endpoints:
      - "POST /projects/{id}/threads"
      - "POST /nodes/{id}/messages"
      - "POST /threads/{id}/messages"
      - "PATCH /messages/{id}"
      - "POST /messages/{id}/revoke"
  thread.resolve:
    title: Закрыть и переоткрыть обычный вопрос (обсуждение)
    spec: [FR-DISC-05, 4.4]
    endpoints:
      - "POST /threads/{id}/resolve"
      - "POST /threads/{id}/reopen"
  cq.read:
    title: Список вопросов заказчику (без кнопок выгрузки)
    spec: [FR-CQ-02, 11.11]
    read_only: true
    endpoints:
      - "GET /projects/{id}/customer-questions"
  cq.manage:
    title: Статусы вопросов заказчику и выгрузка в Excel/Word (новые → «отправлен»)
    spec: [FR-CQ-02, FR-CQ-04]
    endpoints:
      - "POST /projects/{id}/customer-questions/export"
  cq.edit:
    title: Править текст вопроса заказчику (после отправки — пометка «изменён после отправки»)
    spec: [BR-CQ-01, Q-46]
    endpoints:
      - "PATCH /threads/{id}/question"
  cq.withdraw:
    title: Снять вопрос заказчику с причиной
    spec: [4.4, BR-CQ-02]
    endpoints:
      - "POST /threads/{id}/withdraw"
  cq.answer:
    title: «Внести ответ заказчика»
    spec: [FR-CQ-03]
    endpoints:
      - "POST /threads/{id}/answer"
  cq.close:
    title: Закрыть отвеченный вопрос заказчику
    spec: [BR-CQ-02, C-05]
    endpoints:
      - "POST /threads/{id}/resolve"
  cq.reopen:
    title: Переоткрыть закрытый вопрос заказчику
    spec: [BR-CQ-02]
    endpoints:
      - "POST /threads/{id}/reopen"

  # --- статистика, снимки, экспорт ---
  stats.read:
    title: Статистика (деньги — только с money.read)
    spec: [10.1]
    read_only: true
    money_fields: true
    endpoints:
      - "GET /projects/{id}/stats"
  snapshot.read:
    title: Список снимков
    spec: [10.1, FR-SNAP-01]
    read_only: true
    money_fields: true
    endpoints:
      - "GET /projects/{id}/snapshots"
  snapshot.create:
    title: Создать снимок
    spec: [FR-SNAP-01, BR-PRJ-02]
    endpoints:
      - "POST /projects/{id}/snapshots"
  snapshot.invalidate:
    title: Пометить снимок «ошибочный»
    spec: [FR-SNAP-02]
    endpoints:
      - "POST /snapshots/{id}/invalidate"
  snapshot.compare:
    title: Сравнение со снимком (деньги — только с money.read)
    spec: [FR-SNAP-03, FR-SNAP-04]
    money_fields: true
    endpoints:
      - "GET /snapshots/{id}/diff"
  export.hours:
    title: Выгрузки без денег — «Часы», вкладки статистики, сравнение снимков (денежные колонки — только с money.read)
    spec: [FR-EXP-01, FR-SNAP-05, GAP-02]
    money_fields: true
    endpoints:
      - "POST /projects/{id}/exports"
      - "GET /exports/{id}"
      - "GET /projects/{id}/stats/{tab}/export"
      - "POST /snapshots/{id}/diff/export"
  export.money:
    title: Выгрузки «с деньгами и допущениями» — Excel «С деньгами», Word «Допущения и риски»
    spec: [FR-EXP-02, 11.10, GAP-02]
    totp_gate: true
    endpoints:
      - "POST /projects/{id}/exports"
      - "GET /projects/{id}/assumptions/export"

