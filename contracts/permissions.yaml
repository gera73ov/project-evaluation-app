# ---------------------------------------------------------------------------
# 7. Таблица 3.4: ограничения по статусу проекта. Право разрешено, только если
# выполнены выдача (раздел 3) И все строки 3.4, в которых оно перечислено
# (для субъектов из applies_to). Источник данных для TC-SEC-06.
# ---------------------------------------------------------------------------
matrix_3_4:
- id: M3.4-01
  key: project.visibility
  action: Проект виден в «Моих оценках»
  permissions: [project.list_mine, project.read, tree.read, discussion.read]
  applies_to: [project_moderator, project_member]
  statuses:
    preparation:
      spec: модераторы
      effect: allow
      subjects: [project_moderator]
    estimation:
      spec: вся команда
      effect: allow
      subjects: [project_member]
    consolidation:
      spec: вся команда
      effect: allow
      subjects: [project_member]
    completed:
      spec: вся команда
      effect: allow
      subjects: [project_member]
    archived:
      spec: вся команда, по фильтру «Архив» ([Решение Q-44])
      effect: allow
      subjects: [project_member]
      flags: [archive_filter]
- id: M3.4-02
  key: tree.edit.expert
  action: Правка дерева и O/R/P экспертом
  permissions: [tree.write, comment.write, branch.profile.write, node_type.create_local, branch.copy_from,
    branch.status.draft_done, review.mark]
  applies_to: [expert, reviewer]
  statuses:
    preparation: {spec: ❌, effect: deny}
    estimation: {spec: ✅ свои, effect: allow, scope: own_discipline}
    consolidation:
      spec: ✅ свои (ветка «готово» → «черновик» с предупреждением до сохранения, [Решение GAP-10])
      effect: allow
      scope: own_discipline
      flags: [warn_done_to_draft_once]
    completed: {spec: ❌, effect: deny}
    archived: {spec: ❌, effect: deny}
- id: M3.4-03
  key: tree.edit.moderator
  action: Правка дерева модератором
  permissions: [tree.write, tree.move.cross_branch, comment.write, branch.profile.write, node_type.create_local,
    branch.copy_from, branch.status.draft_done, branch.status.not_needed, review.mark]
  applies_to: [project_moderator]
  statuses:
    preparation: {spec: ✅, effect: allow}
    estimation: {spec: ✅, effect: allow}
    consolidation: {spec: ✅, effect: allow}
    completed: {spec: ❌ (сначала «Переоткрыть»), effect: deny, note: сначала переход Завершена → Оценка}
    archived: {spec: ❌ (сначала «Восстановить»), effect: deny, note: сначала переход Архив → Завершена}
- id: M3.4-04
  key: settings.team.rates
  action: Настройки, команда, ставки
  permissions: [project.settings.write, project.disciplines.add, team.write, team.replace_member, project.ad_search,
    money.write]
  applies_to: [project_moderator]
  statuses:
    preparation: {spec: ✅, effect: allow}
    estimation: {spec: ✅, effect: allow}
    consolidation: {spec: ✅, effect: allow}
    completed: {spec: ❌, effect: deny}
    archived: {spec: ❌, effect: deny}
- id: M3.4-05
  key: discussion.write
  action: Писать в обсуждениях
  permissions: [discussion.write, thread.resolve]
  applies_to: [project_member]
  statuses:
    preparation:
      spec: модераторы
      effect: allow
      subjects: [project_moderator]
    estimation: {spec: ✅, effect: allow}
    consolidation: {spec: ✅, effect: allow}
    completed:
