  - {who: presale_head, action: POST /api/v1/projects/42/join-as-moderator (archived), expect: 409, by: [M3.3-12, M3.4-14]}
  - {who: presale_head (не модератор проекта), action: POST /api/v1/projects/42/notes, expect: 403, by: [M3.3-32]}
