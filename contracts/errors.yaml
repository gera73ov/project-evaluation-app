# API-001 · Словарь стабильных кодов ошибок API v1 (RFC 9457 Problem Details).
# Владелец: трек API. Версия контракта: 0.1 (черновик до вехи M0). Основание: SPEC v0.5, 15.1, 15.3,
# SEC-WEB-09, SEC-AUTHZ-03, FR-2FA-05, FR-LOCK-01..05, FR-AUTH-AD-09/13, BR-ROLE-03/07, BR-TREE-05/06,
# FR-TREE-31/32, FR-PORT-03, 15.2 (POST /remind → 429).
#
# Как пользоваться:
#   * `code` — стабильный идентификатор; на него опираются фронтенд и тесты (15.1). Код не переименовывается
#     и не переиспользуется; удалённый код помечается `deprecated: true`.
#   * `status` — HTTP-статус ответа. Один код — один статус.
#   * `type` — URI типа проблемы: https://estimator.local/problems/<slug> (как в примере 15.3).
#   * `title` — короткий заголовок по-русски (поле `title` ответа).
#   * `user_message` — текст для пользователя. Если SPEC приводит текст в кавычках, он перенесён дословно
#     (`verbatim: true`); такие тексты меняются только вместе со SPEC. Остальные тексты — рабочие, их
#     окончательную редакцию задают файлы i18n фронтенда (FR-UI-01), ключ `errors.<code>`.
#   * `extensions` — дополнительные поля тела ответа сверх стандартных (`type`, `title`, `status`, `code`,
#     `detail`, `error_id`, `instance`).
#   * `when` — условие, при котором сервер отвечает этим кодом.
#   * `spec` — требования SPEC, из которых следует код.
# Общие правила тела ответа, заголовков и транспорта — contracts/api-conventions.md, раздел 5.
version: "0.1"
type_base: https://estimator.local/problems/

errors:
  # ---------------------------------------------------------------------------------------------
  # Общие: запрос, транспорт, сервер
  # ---------------------------------------------------------------------------------------------
  - code: MALFORMED_REQUEST
    status: 400
    type: malformed-request
    title: Некорректный запрос
    when: Тело не является корректным JSON в UTF-8, нарушен Content-Type, неизвестный параметр пути или запроса.
    user_message: Не удалось обработать запрос. Обновите страницу и повторите.
    spec: [15.1]

  - code: CURSOR_INVALID
    status: 400
    type: cursor-invalid
    title: Неверный курсор пагинации
    when: Параметр `cursor` подделан, устарел или относится к другому списку; `limit` вне 1–200.
    user_message: Список изменился. Обновите страницу.
    spec: [15.1]

  - code: VALIDATION_FAILED
    status: 422
    type: validation-failed
    title: Ошибка в данных
    when: >-
      Тело запроса не проходит схему OpenAPI или правила длины NFR-LIM-01 (обязательное поле, тип, формат,
      длина строки, перечисление). Для чисел вне диапазона — VALUE_OUT_OF_RANGE.
    user_message: Проверьте выделенные поля.
    extensions:
      errors: "массив {field, code, message}; field — JSON Pointer поля запроса, code — машинная причина (required, too_long, too_short, pattern, enum, type)"
    spec: [15.1, NFR-LIM-01]

  - code: VALUE_OUT_OF_RANGE
    status: 422
    type: value-out-of-range
    title: Значение вне допустимого диапазона
    when: >-
      O/R/P вне 0–99 999,5; ×N вне 1–10 000; процент УП вне 0–50; ставка вне 0–1 000 000; курс ≤ 0; срок вне
      1–260 недель; дедлайн раньше сегодняшнего; иной числовой или датовый диапазон SPEC.
      Значение, не кратное 0,5, — не ошибка: сервер округляет его и возвращает фактическое (BR-CALC-03).
    user_message: "Значение должно быть от {min} до {max}"
    extensions:
      field: "имя поля"
      min: "строка-число, нижняя граница"
      max: "строка-число, верхняя граница"
    spec: [15.3, BR-CALC-03, NFR-LIM-01, FR-PRJ-01, BR-PRJ-06]

  - code: PAYLOAD_TOO_LARGE
    status: 413
    type: payload-too-large
    title: Слишком большой запрос
    when: Тело больше 1 МБ (сертификат УЦ — 64 КБ, календарь — 256 КБ, документ — 50 МБ); сообщение WebSocket больше 64 КБ.
    user_message: "Файл или запрос слишком большой: не более {limit}"
    extensions:
      limit_bytes: "целое, допустимый размер"
    spec: [SEC-WEB-08, FR-DOC-01]

  - code: UNSUPPORTED_MEDIA_TYPE
    status: 415
    type: unsupported-media-type
    title: Недопустимый тип файла
    when: Тип загружаемого файла по сигнатуре содержимого не PDF, DOCX или XLSX, либо файл с макросами (.docm, .xlsm); CSV календаря не в формате data.gov.ru.
    user_message: Можно загрузить только PDF, DOCX или XLSX без макросов.
    spec: [SEC-WEB-10, FR-DOC-01, GAP-03]

  - code: RATE_LIMITED
    status: 429
    type: rate-limited
    title: Слишком много запросов
    when: >-
      Превышен лимит частоты: 300 изменяющих запросов в минуту, 30 экспортов в час, 60 сообщений в обсуждениях
      в минуту на пользователя (SEC-WEB-07); 20 попыток входа в минуту с IP (FR-LOCK-02, ответ на 5 минут).
      Заголовок `Retry-After` обязателен.
    user_message: Слишком много запросов. Повторите через {retry_after} с.
    extensions:
      retry_after: "целое, секунд (дублирует заголовок Retry-After)"
    spec: [SEC-WEB-07, FR-LOCK-02]

  - code: INTERNAL_ERROR
    status: 500
    type: internal-error
    title: Внутренняя ошибка
    when: Необработанное исключение. Тело содержит только стандартные поля и `error_id`; трассировок, SQL и версий нет.
    user_message: Что-то пошло не так. Сообщите администратору код ошибки {error_id}.
    spec: [SEC-WEB-09]

  - code: SERVICE_UNAVAILABLE
    status: 503
    type: service-unavailable
    title: Сервис временно недоступен
    when: Недоступна БД, Redis или другой обязательный компонент; приложение в режиме обслуживания.
    user_message: Сервис временно недоступен. Повторите через несколько минут.
    spec: [NFR-REL-01, SEC-WEB-09]

  - code: APP_SETUP_IN_PROGRESS
    status: 503
    type: app-setup-in-progress
    title: Приложение настраивается
    when: Мастер первичной настройки не завершён, а запрос пришёл не от суперадминистратора (FR-SA-02).
    user_message: Приложение настраивается
    verbatim: true
    spec: [FR-SA-02]

  # ---------------------------------------------------------------------------------------------
  # Аутентификация и сессия
  # ---------------------------------------------------------------------------------------------
  - code: UNAUTHENTICATED
    status: 401
    type: unauthenticated
    title: Требуется вход
    when: Нет cookie сессии, сессия истекла (бездействие или абсолютный срок) или отозвана.
    user_message: Сессия завершена. Войдите снова.
    spec: [FR-SESS-01, FR-SESS-02, FR-SESS-05, 17.3]

  - code: LOGIN_FAILED
    status: 401
    type: login-failed
    title: Неверный логин или пароль
    when: >-
      Любой отказ входа по логину и паролю: нет пользователя, неверный пароль, пользователь заблокирован или не
      активирован, в режиме AD — учётка отключена, не в группе доступа, поиск вернул не одну запись. Пустые
      поля отклоняются тем же кодом до обращения к AD. Ответ одинаков по тексту и сопоставим по времени;
      причина — только в аудите (`login.failed` с причиной из contracts/audit-events.yaml).
    user_message: Неверный логин или пароль
    user_message_ad: Неверный логин или пароль. Если уверены в пароле — обратитесь к администратору
    verbatim: true
    extensions:
      auth_mode: "app | ad — какой текст показать (в режиме AD добавляется подсказка, 11.1 №4)"
    spec: [FR-AUTH-AD-05, FR-AUTH-AD-13, FR-LOCK-01, FR-LOCK-05, R-04, 11.1]

  - code: LOGIN_LOCKED
    status: 429
    type: login-locked
    title: Вход временно заблокирован
    when: >-
      Пара «логин + IP» заблокирована после 5 неудач подряд (FR-LOCK-01). Ответ одинаков для существующих и
      несуществующих логинов. Заголовок `Retry-After` — оставшееся время блокировки. Сколько попыток осталось,
      не сообщается (FR-LOCK-05). Логины суперадминистраторов не блокируются (FR-LOCK-04).
    user_message: Слишком много попыток, повторите через 15 минут
    verbatim: true
    notes: Число минут в тексте — срок блокировки из `security.lockout` (по умолчанию 15, текст SPEC).
    spec: [FR-LOCK-01, FR-LOCK-05, 11.1]

  - code: AUTH_SERVICE_UNAVAILABLE
    status: 503
    type: auth-service-unavailable
    title: Сервис аутентификации недоступен
    when: Режим AD, все контроллеры недоступны или не отвечают за таймаут. Суперадминистраторов не касается (FR-SA-03).
    user_message: Сервис аутентификации временно недоступен
    verbatim: true
    spec: [FR-AUTH-AD-09, 11.1]

  - code: LOGIN_STEP_EXPIRED
    status: 401
    type: login-step-expired
    title: Время на ввод кода истекло
    when: Временный токен шага TOTP (5 минут) истёк, аннулирован кнопкой «Назад» или уже использован.
    user_message: Время на ввод кода истекло. Войдите снова.
    spec: [7.2, 11.1]

  - code: TOTP_INVALID
    status: 401
    type: totp-invalid
    title: Неверный код
    when: >-
      Код TOTP или резервный код не принят: неверный, вне допуска ±1 шаг, уже использован (защита от повтора).
      Считается неудачной попыткой входа (FR-LOCK-03).
    user_message: Неверный код. Проверьте время на телефоне и введите новый код.
    spec: [FR-2FA-01, FR-LOCK-03]

  - code: TOTP_ENROLL_REQUIRED
    status: 403
    type: totp-enroll-required
    title: Подключите второй фактор
    when: TOTP обязателен для пользователя, но не подключён; до подключения доступны только `/auth/totp/enroll*` и выход (FR-2FA-04).
    user_message: Подключите приложение-аутентификатор, чтобы продолжить.
    spec: [FR-2FA-04]

  - code: TOTP_REQUIRED
    status: 403
    type: totp-required
    title: Подтвердите вход кодом
    when: >-
      Эндпоинт с правом `money.*` или `notes.*` вызван в сессии без пройденного TOTP (FR-2FA-05). В общих ответах
      денежные поля в этом случае просто отсутствуют; ошибкой отвечают только денежные и заметочные эндпоинты.
    user_message: 🔒 Подтвердите вход кодом
    verbatim: true
    spec: [FR-2FA-05, SEC-AUTHZ-04, R-05, TC-AUTH-08]

  - code: STEP_UP_REQUIRED
    status: 403
    type: step-up-required
    title: Подтвердите действие
    when: Действие из SEC-AUTH-05 (и удаление TOTP, выгрузка аудита, сбросы) вызвано без действующего step-up (5 минут).
    user_message: Подтвердите действие паролем и кодом из приложения.
    spec: [SEC-AUTH-05, FR-SA-05, FR-AUTH-SW-01]

  - code: STEP_UP_FAILED
    status: 401
    type: step-up-failed
    title: Подтверждение не принято
    when: При step-up неверный пароль или код TOTP. Сессия не завершается; неудача пишется в аудит и учитывается FR-LOCK-01.
    user_message: Неверный пароль или код.
    spec: [SEC-AUTH-05, FR-2FA-05]

  - code: CSRF_FAILED
    status: 403
    type: csrf-failed
    title: Запрос отклонён
    when: Изменяющий запрос без заголовка `X-CSRF-Token` или с токеном, не привязанным к текущей сессии.
    user_message: Страница устарела. Обновите её и повторите действие.
    spec: [SEC-WEB-04, TC-SEC-08]

  - code: TOKEN_INVALID
    status: 410
    type: token-invalid
    title: Ссылка недействительна
    when: Токен ссылки активации, сброса пароля или первичной настройки не найден, истёк, уже использован или аннулирован новой ссылкой.
    user_message: Ссылка недействительна или устарела. Запросите новую.
    spec: [SEC-AUTH-03, FR-SA-01, FR-AUTH-LOC-01, FR-AUTH-LOC-03]

  - code: PASSWORD_POLICY_VIOLATION
    status: 422
    type: password-policy-violation
    title: Пароль не подходит
    when: Новый пароль нарушает политику FR-AUTH-LOC-02 (длина, список распространённых, совпадение с логином, ФИО или email, история, состав).
    user_message: Пароль не соответствует требованиям.
    extensions:
      violations: "массив кодов: too_short, too_long, common, matches_personal, reused, composition"
    spec: [FR-AUTH-LOC-02]

  - code: CURRENT_PASSWORD_INVALID
    status: 422
    type: current-password-invalid
    title: Неверный текущий пароль
    when: Смена пароля в профиле с неверным текущим паролем (FR-AUTH-LOC-04).
    user_message: Текущий пароль указан неверно.
    spec: [FR-AUTH-LOC-04]

  # ---------------------------------------------------------------------------------------------
  # Авторизация и доступ к объектам
  # ---------------------------------------------------------------------------------------------
  - code: FORBIDDEN
    status: 403
    type: forbidden
    title: Нет доступа
    when: >-
      Объект виден пользователю (он участник проекта или объект системный), но права на действие нет:
      эксперт правит чужую ветку, переносит лист в чужую ветку, читает деньги или заметки; пресейл правит O/R/P;
      администратор в режиме поддержки пишет; руководитель пресейла добавляет другого модератора; автор правит
      отправленный вопрос заказчику; пользователь меняет свои системные роли (SEC-AUTHZ-06).
    user_message: Недостаточно прав для этого действия.
    extensions:
      permission: "код права из contracts/permissions.yaml, которого не хватило (не выдаётся для объектов, существование которых скрывается)"
    spec: [SEC-AUTHZ-01, SEC-AUTHZ-02, SEC-AUTHZ-05, SEC-AUTHZ-06, BR-CQ-01]

  - code: NOT_FOUND
    status: 404
    type: not-found
    title: Не найдено
    when: >-
      Объекта нет, или он принадлежит проекту, где пользователь не участник (и не руководитель пресейла, и не
      в режиме поддержки) — 404 вместо 403, чтобы не раскрывать существование (SEC-AUTHZ-03). Так же отвечают
      пути админки суперадминистратора из неразрешённой сети (FR-SA-06) и пути мастера установки после его
      завершения.
    user_message: Страница не найдена.
    spec: [SEC-AUTHZ-03, FR-SA-06, 12.2]

  # ---------------------------------------------------------------------------------------------
  # Дерево и совместная работа
  # ---------------------------------------------------------------------------------------------
  - code: FIELD_CONFLICT
    status: 409
    type: field-conflict
    title: Значение уже изменено
    when: >-
      PATCH узла с `base_version`, после которой то же поле изменил другой пользователь (FR-TREE-32). Изменения
      разных полей одного узла не конфликтуют. Клиент показывает «Значение изменил <ФИО>: <текущее>. Ваше:
      <введённое>» с кнопками «Оставить моё» и «Принять».
    user_message: "Значение изменил {changed_by}: {current}. Ваше: {yours}."
    extensions:
      conflicts: "массив {field, current, changed_by, changed_at} (пример 15.3)"
      current_version: "целое, текущая версия узла"
    spec: [FR-TREE-32, 15.3, TC-CONC-02, G-14]

  - code: CELL_LOCKED
    status: 423
    type: cell-locked
    title: Ячейку редактирует другой пользователь
    when: >-
      PATCH поля, захваченного другим пользователем (FR-TREE-31); тот же код — ответ на WS-команду `lock`,
      если поле занято, а `force` не передан или пользователь не модератор.
    user_message: Сейчас редактирует {locked_by_name}
    verbatim_template: "Сейчас редактирует И. Иванов"
    extensions:
      locked_by: "{id, name, initials, color} — владелец захвата"
      field: "поле"
      node_id: "узел"
    spec: [FR-TREE-31, 15.3, TC-CONC-04]

  - code: NODE_HAS_CHILDREN
    status: 422
    type: node-has-children
    title: У узла есть дочерние строки
    when: Попытка задать O/R/P или ×N узлу, у которого есть живые дети (BR-TREE-01).
    user_message: Оценку ставят только листьям. Сверните узел в лист или оцените дочерние строки.
    spec: [15.3, BR-TREE-01]

  - code: DEPTH_LIMIT
    status: 422
    type: depth-limit
    title: Слишком глубокая вложенность
    when: Создание, перенос, восстановление или копирование ветки дают глубину больше 8 уровней ниже ветки дисциплины (BR-TREE-05).
    user_message: Нельзя вложить глубже 8 уровней ниже дисциплины.
    extensions:
      max_depth: "целое, 8"
    spec: [15.3, BR-TREE-05, FR-PRJ-03, FR-TREE-24]

  - code: NODES_LIMIT
    status: 409
    type: nodes-limit
    title: Достигнут предел узлов проекта
    when: После создания, восстановления из корзины, копирования ветки или дублирования живых узлов проекта стало бы больше 5 000 (BR-TREE-06).
    user_message: В проекте не может быть больше 5 000 строк. Удалите лишние или разделите оценку.
    extensions:
      limit: "целое, 5000"
      current: "целое, живых узлов сейчас"
      requested: "целое, сколько добавляет операция"
    spec: [15.3, BR-TREE-06, FR-PRJ-03, FR-TREE-24]

  - code: RESTORE_TARGET_UNAVAILABLE
    status: 409
    type: restore-target-unavailable
    title: Прежнее место недоступно
    when: >-
      Восстановление из корзины, когда место недоступно: фаза выключена, ветка «не нужно», дисциплина удалена
      из проекта (FR-TREE-24). Клиент предлагает выбрать узел той же дисциплины и повторяет запрос с
      `target_parent_id`.
    user_message: Прежнее место недоступно. Выберите, куда восстановить.
    extensions:
      reason: "phase_disabled | branch_not_needed | discipline_removed"
      discipline_id: "дисциплина, в пределах которой выбирать"
    spec: [FR-TREE-24, G-15]

  - code: BRANCH_NOT_READY
    status: 409
    type: branch-not-ready
    title: Ветку нельзя отметить «готово»
    when: Перевод ветки в «готово», когда в ней есть листья с пустой оценкой или с нарушением O ≤ R ≤ P (BR-BR-01).
    user_message: "В ветке есть листья без оценки или с ошибкой: {count}"
    extensions:
      node_ids: "массив id неготовых листьев"
    spec: [BR-BR-01, 4.3]

  - code: BRANCH_NOT_EMPTY
    status: 409
    type: branch-not-empty
    title: Ветка не пустая
    when: Перевод ветки «черновик» → «не нужно», когда в ней есть узлы (4.3); удаление дисциплины из проекта, когда хотя бы одна её ветка не пустая (5.1).
    user_message: Действие доступно только для пустой ветки.
    spec: [4.3, 5.1, BR-CALC-01]

  - code: INVALID_TRANSITION
    status: 409
    type: invalid-transition
    title: Переход недоступен
    when: >-
      Запрошен переход, которого нет в диаграмме: статус проекта (4.2), статус ветки (4.3), статус вопроса
      заказчику (4.4), например «отвечен → новый» или повторное закрытие.
    user_message: Это действие недоступно в текущем состоянии.
    extensions:
      from: "текущее состояние"
      to: "запрошенное состояние"
    spec: [4.2, 4.3, 4.4, FR-PRJ-05, BR-CQ-02]

  - code: PROJECT_STATUS_CONFLICT
    status: 409
    type: project-status-conflict
    title: Недоступно в этом статусе проекта
    when: >-
      Роль по матрице 3.3 действие разрешает, но статус проекта его запрещает (таблица 3.4): правка дерева в
      «Завершена» и «Архив», снимок в «Подготовке» и «Архиве», «Стать модератором проекта» в «Архиве»
      (FR-PORT-03), письмо в обсуждении в «Завершена» и т. д.
    user_message: "Действие недоступно, пока проект в статусе «{status}»"
    extensions:
      project_status: "preparation | estimation | consolidation | completed | archived"
    spec: [3.4, FR-PORT-03, BR-PRJ-02, SEC-AUTHZ-05, TC-SEC-06, G-21]

  - code: CONFIRMATION_REQUIRED
    status: 409
    type: confirmation-required
    title: Требуется подтверждение
    when: >-
      Действие с последствиями, которое SPEC разрешает только после подтверждения, вызвано без `confirm: true`:
      выключение фазы с непустыми ветками (5.1, 11.6 №2). Клиент показывает диалог и повторяет запрос.
    user_message: "Подтвердите действие: {consequence}"
    extensions:
      consequence: "машинный код последствия, например branches_to_trash"
      affected: "число затронутых объектов"
    spec: [5.1, 11.6]

  - code: CROSS_CUTTING_PHASE_LOCKED
    status: 409
    type: cross-cutting-phase-locked
    title: Фазу «Управление проектом» не выключают
    when: Попытка выключить в проекте сквозную фазу или добавить в неё листья. УП отключают процентом 0%.
    user_message: Фазу «Управление проектом» нельзя выключить. Чтобы убрать УП, поставьте 0%.
    spec: [5.1, 6.3, 11.6]

  - code: VERSION_TOO_OLD
    status: 410
    type: version-too-old
    title: Нужна полная перезагрузка
    when: "`GET /projects/{id}/changes?since=` с версией старше хранимого `change_log` (7 дней) или с большим отставанием."
    user_message: Данные устарели. Загружаем проект заново.
    extensions:
      current_version: "целое, текущая версия проекта"
    spec: [ARCH-02, FR-TREE-33]

  # ---------------------------------------------------------------------------------------------
  # Команда, роли, пользователи
  # ---------------------------------------------------------------------------------------------
  - code: LAST_MODERATOR
    status: 409
    type: last-moderator
    title: Последний модератор проекта
    when: Удаление из команды, замена или выход последнего модератора проекта (BR-ROLE-07, FR-PORT-03).
    user_message: Нельзя убрать последнего модератора проекта. Сначала назначьте другого.
    spec: [BR-ROLE-07, FR-PORT-03, G-09]

  - code: LAST_SUPERADMIN
    status: 409
    type: last-superadmin
    title: Последний суперадминистратор
    when: Блокировка, разжалование или анонимизация последнего активного суперадминистратора (BR-ROLE-03).
    user_message: Нельзя заблокировать или разжаловать последнего суперадминистратора.
    spec: [BR-ROLE-03, G-08]

  - code: SUPERADMIN_LIMIT
    status: 409
    type: superadmin-limit
    title: Суперадминистраторов уже три
    when: Создание четвёртого суперадминистратора (BR-ROLE-03).
    user_message: Суперадминистраторов может быть не больше трёх.
    spec: [BR-ROLE-03]

  - code: ROLE_INCOMPATIBLE
    status: 409
    type: role-incompatible
    title: Роли несовместимы
    when: >-
      Сочетание ролей запрещено BR-ROLE-02: суперадминистратор с любой другой ролью или в проекте; аудитор ИБ с
      любой ролью, кроме «Пользователь»; ручная выдача «Модератор» и «Пресейл» пользователю AD при включённом
      сопоставлении групп (FR-AUTH-AD-07).
    user_message: Эти роли нельзя совмещать.
    extensions:
      conflicting_roles: "массив ролей"
    spec: [BR-ROLE-02, FR-AUTH-AD-07]

  - code: MEMBER_ROLE_REQUIRED
    status: 422
    type: member-role-required
    title: У пользователя нет нужной системной роли
    when: >-
      Назначение модератором проекта без системной роли «Модератор» (руководитель пресейла — только сам себя);
      пресейлом — без роли «Пресейл»; замена участника на пользователя без нужной роли (FR-ADM-05).
    user_message: "У пользователя нет роли «{role}»"
    extensions:
      required_role: "moderator | presale | presale_head"
    spec: [FR-PRJ-01, FR-ADM-05, FR-PORT-03]

  - code: MEMBER_LIMIT
    status: 422
    type: member-limit
    title: Превышено число участников роли
    when: В проекте больше 3 пресейлов (FR-PRJ-01).
    user_message: В проекте может быть не больше 3 пресейлов.
    extensions:
      role: "presale"
      limit: "целое"
    spec: [FR-PRJ-01]

  - code: ALREADY_EXISTS
    status: 409
    type: already-exists
    title: Уже существует
    when: Нарушена уникальность — логин (без учёта регистра), email, код валюты, название дисциплины, участник с той же ролью и дисциплиной.
    user_message: Такая запись уже есть.
    extensions:
      field: "поле, по которому совпадение"
    spec: [FR-AUTH-LOC-01, 7.5, 14.2]

  - code: USER_NOT_BLOCKED
    status: 409
    type: user-not-blocked
    title: Пользователь не заблокирован
    when: Анонимизация незаблокированного пользователя (SEC-PD-03).
    user_message: Анонимизировать можно только заблокированного пользователя.
    spec: [SEC-PD-03]

  - code: AD_USER_NOT_IN_GROUP
    status: 409
    type: ad-user-not-in-group
    title: Нет в группе доступа
    when: Заведение из каталога AD человека, не состоящего в группе доступа (FR-AUTH-AD-10).
    user_message: Пользователь не состоит в группе доступа к приложению.
    spec: [FR-AUTH-AD-10]

  - code: DICTIONARY_IN_USE
    status: 409
    type: dictionary-in-use
    title: Запись справочника используется
    when: >-
      Удаление записи справочника, которая используется в проектах (фаза, профиль); отключение типа «Работа»,
      RUB, ставки «без НДС»; снятие признака «по умолчанию» или «сквозная» без назначения другой записи.
    user_message: Запись используется. Её можно только сделать неактивной.
    spec: [7.5, BR-TREE-08]

  # ---------------------------------------------------------------------------------------------
  # Система и настройки
  # ---------------------------------------------------------------------------------------------
  - code: SETUP_ALREADY_COMPLETED
    status: 409
    type: setup-already-completed
    title: Первичная настройка уже завершена
    when: Запись в шаг мастера `/system/setup/{step}` после завершения мастера.
    user_message: Первичная настройка уже выполнена. Параметры меняются в разделе «Система».
    spec: [7.1, 15.2]

  - code: AD_CHECKS_REQUIRED
    status: 409
    type: ad-checks-required
    title: Сначала проверьте подключение и вход
    when: Сохранение параметров AD, пока после последнего изменения не прошли «Проверить подключение» и «Проверить вход» (FR-AUTH-AD-03).
    user_message: Сохранить можно после успешных проверок подключения и входа.
    extensions:
      missing: "массив: connection, login"
    spec: [FR-AUTH-AD-03, 11.2]

  - code: MODE_SWITCH_NOT_ALLOWED
    status: 409
    type: mode-switch-not-allowed
    title: Переход недоступен в интерфейсе
    when: "`POST /system/auth/switch-mode` с `mode = local` (обратный переход только консолью) или повторный переход в текущий режим."
    user_message: Переход на вход через приложение выполняет служба эксплуатации консольной командой.
    spec: [FR-AUTH-SW-01, G-11]

  - code: MODE_SWITCH_UNRESOLVED
    status: 409
    type: mode-switch-unresolved
    title: Есть нерешённые совпадения
    when: Применение перехода «Приложение → AD», пока не решён каждый «неоднозначный» пользователь (FR-AUTH-SW-01, C-13).
    user_message: "Решите по каждому неоднозначному совпадению: осталось {count}"
    extensions:
      unresolved: "целое"
    spec: [FR-AUTH-SW-01, C-13, G-10]

  # ---------------------------------------------------------------------------------------------
  # Обсуждения и вопросы заказчику
  # ---------------------------------------------------------------------------------------------
  - code: MESSAGE_HAS_REPLIES
    status: 409
    type: message-has-replies
    title: На сообщение уже ответили
    when: Автор правит своё сообщение, на которое уже есть ответ (FR-DISC-06). Отзыв при этом доступен.
    user_message: "Сообщение нельзя изменить: на него уже ответили. Его можно отозвать."
    spec: [FR-DISC-06]

  # ---------------------------------------------------------------------------------------------
  # Документы, экспорт, напоминания
  # ---------------------------------------------------------------------------------------------
  - code: PROJECT_STORAGE_LIMIT
    status: 409
    type: project-storage-limit
    title: Место проекта закончилось
    when: После загрузки документы проекта (проверяемые и чистые) заняли бы больше 1 ГБ (FR-DOC-01, 11.7 №4).
    user_message: В проекте не хватает места для файла (лимит 1 ГБ).
    extensions:
      used_bytes: "целое"
      limit_bytes: "целое"
    spec: [FR-DOC-01, NFR-LIM-01]

  - code: DOCUMENT_NOT_AVAILABLE
    status: 409
    type: document-not-available
    title: Документ недоступен
    when: Скачивание документа, который ещё проверяется антивирусом, заражён или не прошёл проверку (SEC-WEB-10, 11.7 №2–3).
    user_message: Файл ещё проверяется или не прошёл проверку.
    extensions:
      scan_status: "pending | infected | error"
    spec: [SEC-WEB-10, 11.7]

  - code: EXPORT_EXPIRED
    status: 410
    type: export-expired
    title: Файл выгрузки удалён
    when: Скачивание файла выгрузки старше 24 часов (FR-EXP-05).
    user_message: Файл больше недоступен. Сформируйте выгрузку заново.
    spec: [FR-EXP-05, NFR-REL-06]

  - code: EXPORT_FAILED
    status: 409
    type: export-failed
    title: Выгрузка не удалась
    when: Фоновая задача выгрузки завершилась ошибкой; `GET /exports/{id}` отвечает этим кодом с `error_id` задачи.
    user_message: Экспорт не удался · error_id {error_id}
    spec: [FR-EXP-05, SEC-WEB-09]

  - code: REMIND_TOO_OFTEN
    status: 429
    type: remind-too-often
    title: Напоминание уже отправлено
    when: "`POST /projects/{id}/remind` повторно в течение суток. Заголовок `Retry-After` — сколько осталось."
    user_message: Напомнить можно не чаще раза в сутки.
    extensions:
      retry_after: "целое, секунд"
    spec: [15.2]
