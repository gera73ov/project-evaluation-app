      additionalProperties: false
    NotificationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        unread:
          type: integer
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - items
      - unread
      - next_cursor
      additionalProperties: false
    PortfolioItemMoney:
      type: object
      properties:
        currency:
          type: string
        quote_cur:
          anyOf:
          - $ref: '#/components/schemas/MoneyString'
          - type: 'null'
        quote_rub:
          anyOf:
          - $ref: '#/components/schemas/MoneyString'
          - type: 'null'
        cost_rub:
          anyOf:
          - $ref: '#/components/schemas/MoneyString'
          - type: 'null'
        contract_amount:
          anyOf:
          - $ref: '#/components/schemas/MoneyString'
          - type: 'null'
        rates_missing:
          type: boolean
      required:
      - currency
      - quote_cur
      - quote_rub
      - cost_rub
      - contract_amount
      - rates_missing
      additionalProperties: false
    PortfolioItem:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        customer:
          type: string
        moderators:
          type: array
          items:
            $ref: '#/components/schemas/UserRef'
        presales:
          type: array
          items:
            $ref: '#/components/schemas/UserRef'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        outcome:
          $ref: '#/components/schemas/Outcome'
        quote_figure:
          $ref: '#/components/schemas/QuoteFigure'
        quote_hours:
          anyOf:
          - $ref: '#/components/schemas/HoursString'
          - type: 'null'
        no_moderator:
