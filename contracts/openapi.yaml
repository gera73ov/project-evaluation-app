        by_status:
          type: object
          properties: {}
        by_outcome:
          type: object
          properties: {}
        won_share_count_pct:
          anyOf:
          - $ref: '#/components/schemas/DecimalString'
          - type: 'null'
        won_share_money_pct:
          anyOf:
          - $ref: '#/components/schemas/DecimalString'
          - type: 'null'
        sum_won_cur:
          anyOf:
          - $ref: '#/components/schemas/MoneyString'
          - type: 'null'
        sum_lost_cur:
          anyOf:
          - $ref: '#/components/schemas/MoneyString'
          - type: 'null'
        sum_in_progress_cur:
          anyOf:
          - $ref: '#/components/schemas/MoneyString'
          - type: 'null'
        loss_reasons:
          type: array
