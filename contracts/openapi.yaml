          default: 50
      - name: unread
        in: query
        required: false
        schema:
          type: boolean
      x-error-codes:
      - UNAUTHENTICATED
      - TOTP_ENROLL_REQUIRED
      - PASSWORD_CHANGE_REQUIRED
      - CURSOR_INVALID
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '500':
          $ref: '#/components/responses/Problem500'
  /notifications/read:
    post:
      operationId: markNotificationsRead
      summary: Отметить прочитанными
      tags:
      - Уведомления
      x-permission: authenticated
      x-spec:
      - FR-NOTIF-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationsRead'
      x-error-codes:
      - UNAUTHENTICATED
      - TOTP_ENROLL_REQUIRED
      - PASSWORD_CHANGE_REQUIRED
      - CSRF_FAILED
      - RATE_LIMITED
      - VALIDATION_FAILED
      responses:
        '204':
          description: Выполнено
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /ws:
    get:
      operationId: websocket
      summary: WebSocket-канал событий (Upgrade)
      tags:
      - Уведомления
      x-permission: authenticated
      description: Протокол — contracts/ws-events.schema.json (RT-001). Проверка Origin; команда subscribe проверяет tree.read
      x-spec:
      - '15.4'
      - SEC-WEB-04
      x-error-codes:
      - UNAUTHENTICATED
      - TOTP_ENROLL_REQUIRED
      - PASSWORD_CHANGE_REQUIRED
      responses:
        '101':
          description: Switching Protocols
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '500':
          $ref: '#/components/responses/Problem500'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
      description: Серверная сессия (FR-SESS-01); изменяющие запросы — с X-CSRF-Token (SEC-WEB-04)
  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUID v7 (api-conventions 2.3)
    DecimalString:
      type: string
      pattern: ^-?\d+(\.\d+)?$
      description: Десятичное число строкой (api-conventions 2.1); на вход сервер принимает и запятую
      x-ts-type: DecimalString
    HoursString:
      type: string
      pattern: ^\d+\.\d{2}$
      description: 'Расчётные часы: 2 знака, ROUND_HALF_UP (15.3)'
      x-ts-type: DecimalString
    SignedHoursString:
      type: string
      pattern: ^-?\d+\.\d{2}$
      description: 'Разница расчётных часов: 2 знака, со знаком (сравнение снимков, CR-008)'
      x-ts-type: DecimalString
    SignedMoneyString:
      type: string
      pattern: ^-?\d+$
      description: 'Разница денег: целое число со знаком (сравнение снимков, CR-008)'
      x-ts-type: DecimalString
    MoneyString:
      type: string
      pattern: ^\d+$
      description: 'Деньги: целое число ₽ или единиц валюты КП (BR-MONEY-04)'
      x-ts-type: DecimalString
    HoursInput:
      anyOf:
      - type: string
        pattern: ^\d+([.,]\d+)?$
        maxLength: 12
      - type: 'null'
      description: 'O/R/P на вход: 0–99 999,5, округляется до 0,5 (BR-CALC-03); null — очистить'
      x-ts-type: DecimalString | null
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 UTC с Z
    Date:
      type: string
      format: date
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          description: Код из contracts/errors.yaml
        detail:
          type: string
        error_id:
          type: string
        instance:
          type: string
      required:
      - type
      - title
      - status
      - code
      - error_id
      description: RFC 9457 (api-conventions 5); расширения — по коду в errors.yaml
    UserRef:
      type: object
      description: Ссылка на пользователя; та же форма, что UserRef в ws-events.schema.json. color — цвет
        рамки захвата и аватара в «Кто сейчас в проекте» (FR-TREE-31, 8.2)
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        full_name:
          type: string
          maxLength: 200
        initials:
          type: string
          maxLength: 4
        is_active:
          type: boolean
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
      required:
      - id
      - full_name
      - initials
      additionalProperties: false
    SystemRole:
      type: string
      enum:
      - superadmin
      - admin
      - moderator
      - presale
      - presale_head
      - security_auditor
    ProjectRole:
      type: string
      enum:
      - moderator
      - expert
      - presale
    ProjectStatus:
      type: string
      enum:
      - preparation
      - estimation
      - consolidation
      - completed
      - archived
    BranchStatusValue:
      type: string
      enum:
      - not_started
      - draft
      - done
      - not_needed
    QuoteFigure:
      type: string
      enum:
      - e
      - p80
      - p90
    DetailLevel:
      type: string
      enum:
      - coarse
      - medium
      - detailed
    Outcome:
      type: string
      enum:
      - unknown
      - won
      - lost
      - cancelled
    CustomerStatus:
      type: string
      enum:
      - new
      - sent
      - answered
      - closed
      - withdrawn
    HoursTotals:
      type: object
      properties:
        e:
          $ref: '#/components/schemas/HoursString'
        sigma:
          $ref: '#/components/schemas/HoursString'
        p80:
          $ref: '#/components/schemas/HoursString'
        p90:
          $ref: '#/components/schemas/HoursString'
      required:
      - e
      - p80
      - p90
      additionalProperties: false
      description: Часы без денег
    SignedHoursTotals:
      type: object
      properties:
        e:
          $ref: '#/components/schemas/SignedHoursString'
        sigma:
          $ref: '#/components/schemas/SignedHoursString'
        p80:
          $ref: '#/components/schemas/SignedHoursString'
        p90:
          $ref: '#/components/schemas/SignedHoursString'
      required:
      - e
      - p80
      - p90
      additionalProperties: false
      description: Разница итогов в часах со знаком (CR-008)
    LoginRequest:
      type: object
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
      required:
      - login
      - password
      additionalProperties: false
    AuthOptions:
      type: object
      description: CR-001. Режим входа приложения (app — учётные записи приложения, ad — Active Directory).
      properties:
        auth_mode:
          type: string
          enum:
          - app
          - ad
      required:
      - auth_mode
      additionalProperties: false
    LoginResponse:
      type: object
      properties:
        step:
          type: string
          enum:
          - done
          - totp
          - enroll
          - password_change
        login_token:
          type: string
          description: Временный токен шага TOTP, 5 минут; только при step = totp
        expires_in:
          type: integer
      required:
      - step
      additionalProperties: false
      description: step=done — сессия создана (Set-Cookie); totp — нужен код; enroll — сессия до подключения TOTP (FR-2FA-04); password_change — пароль истёк, сессия только для смены пароля и выхода (FR-AUTH-LOC-02, CR-003)
    TotpLoginRequest:
      type: object
      properties:
        login_token:
          type: string
        code:
          type: string
          pattern: ^\d{6}$
        backup_code:
          type: string
          pattern: ^\d{8}$
      required:
      - login_token
      additionalProperties: false
      description: Ровно одно из code / backup_code
    TotpEnrollStart:
      type: object
      properties:
        otpauth_uri:
          type: string
        secret:
          type: string
          description: Base32 для ручного ввода
      required:
      - otpauth_uri
      - secret
      additionalProperties: false
    TotpCode:
      type: object
      properties:
        code:
          type: string
          pattern: ^\d{6}$
      required:
      - code
      additionalProperties: false
    BackupCodes:
      type: object
      properties:
        backup_codes:
          type: array
          items:
            type: string
            pattern: ^\d{8}$
          minItems: 10
          maxItems: 10
      required:
      - backup_codes
      additionalProperties: false
    StepUpRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
        code:
          type: string
          pattern: ^\d{6}$
        totp_only:
          type: boolean
          default: false
      required:
      - code
      additionalProperties: false
      description: totp_only=true — подтверждение кодом для денег (FR-2FA-05), пароль не нужен
    StepUpResponse:
      type: object
      properties:
        mfa_passed:
          type: boolean
        step_up_until:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      required:
      - mfa_passed
      - step_up_until
      additionalProperties: false
    TokenPassword:
      type: object
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 128
        password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
      required:
      - token
      - password
      additionalProperties: false
    ForgotRequest:
      type: object
      properties:
        login_or_email:
          type: string
          minLength: 1
          maxLength: 254
      required:
      - login_or_email
      additionalProperties: false
    Me:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        login:
          type: string
        full_name:
          type: string
        email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
        source:
          type: string
          enum:
          - local
          - ad
        timezone:
          anyOf:
          - type: string
          - type: 'null'
        system_roles:
          type: array
          items:
            $ref: '#/components/schemas/SystemRole'
        totp_enabled:
          type: boolean
        totp_required:
          type: boolean
        mfa_passed:
          type: boolean
        auth_mode:
          type: string
          enum:
          - app
          - ad
        session_expires_at:
          $ref: '#/components/schemas/Timestamp'
        idle_timeout_seconds:
          type: integer
      required:
      - id
      - login
      - full_name
      - email
      - source
      - timezone
      - system_roles
      - totp_enabled
      - totp_required
      - mfa_passed
      - auth_mode
      - session_expires_at
      - idle_timeout_seconds
      additionalProperties: false
    MePatch:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Только local
        timezone:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
      additionalProperties: false
    Session:
      type: object
      properties:
        id:
          type: string
          description: Непрозрачный id (хэш)
        current:
          type: boolean
        user_agent:
          anyOf:
          - type: string
          - type: 'null'
        ip:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
      - current
      - user_agent
      - ip
      - created_at
      - last_seen_at
      additionalProperties: false
    PasswordChange:
      type: object
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
        new_password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
      required:
      - current_password
      - new_password
      additionalProperties: false
    NotificationSettings:
      type: object
      properties:
        notify_digest:
          type: boolean
        notify_questions:
          type: boolean
      required:
      - notify_digest
      - notify_questions
      additionalProperties: false
    ViewState:
      type: object
      properties:
        state:
          type: object
          properties: {}
          description: Раскрытие, фильтры, ширины (FR-TREE-14), ≤ 64 КБ
      required:
      - state
      additionalProperties: false
    SetupStep:
      type: object
      properties:
        step:
          type: string
          enum:
          - app
          - smtp
          - auth
          - security
          - first_admin
        done:
          type: boolean
        values:
          type: object
          properties: {}
      required:
      - step
      - done
      additionalProperties: false
    SetupStepWrite:
      type: object
      properties:
        values:
          type: object
          properties: {}
          description: Ключи шага по contracts/settings.schema.json
        complete:
          type: boolean
          default: false
      required:
      - values
      additionalProperties: false
    Health:
      type: object
      properties:
        app_version:
          type: string
        schema_version:
          type: string
        components:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                enum:
                - db
                - redis
                - smtp
                - ldap
                - siem
                - queue
                - backup
                - audit_chain
                - audit_purge
              ok:
                type: boolean
              detail:
                anyOf:
                - type: string
                - type: 'null'
              checked_at:
                $ref: '#/components/schemas/Timestamp'
            required:
            - name
            - ok
            - detail
            - checked_at
            additionalProperties: false
      required:
      - app_version
      - schema_version
      - components
      additionalProperties: false
    MethodSettings:
      type: object
      description: 'Раздел «Пороги и проценты» админки (7.5); ключи method.* из contracts/settings.schema.json
        без префикса (GAP-13)'
      properties:
        large_leaf_hours:
          type: object
          description: Порог «крупного листа» по E одной штуки для уровней Средне и Детально (BR-TREE-09)
          properties:
            medium:
              $ref: '#/components/schemas/HoursString'
            detailed:
              $ref: '#/components/schemas/HoursString'
          required:
          - medium
          - detailed
          additionalProperties: false
        medium_expected_units:
          type: object
          description: Ожидаемое число единиц в ветке при уровне «Средне» (5.2)
          properties:
            min:
              type: integer
              minimum: 1
              maximum: 1000
            max:
              type: integer
              minimum: 1
              maximum: 1000
          required:
          - min
          - max
          additionalProperties: false
        pm_percent_default:
          $ref: '#/components/schemas/DecimalString'
          description: '% УП по умолчанию для новых проектов, 0–50 с шагом 0,5; 0 — УП выключено (6.3)'
        autoarchive_days:
          type: integer
          minimum: 0
          maximum: 3650
          description: Срок автоархивации после «Завершена», дней; 0 — выключено (BR-PRJ-03)
      required:
      - large_leaf_hours
      - medium_expected_units
      - pm_percent_default
      - autoarchive_days
      additionalProperties: false
    SettingsSection:
      type: object
      properties:
        section:
          type: string
        values:
          type: object
          properties: {}
          description: 'Ключи раздела по contracts/settings.schema.json; секреты не отдаются (x-secret), вместо них {"set":
            true}'
      required:
      - section
      - values
      additionalProperties: false
    SettingsWrite:
      type: object
      properties:
        values:
          type: object
          properties: {}
      required:
      - values
      additionalProperties: false
    AdTestLogin:
      type: object
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
      required:
      - login
      - password
      additionalProperties: false
    AdTestResult:
      type: object
      properties:
        ok:
          type: boolean
        elapsed_ms:
          type: integer
        detail:
          anyOf:
          - type: string
          - type: 'null'
        user:
          anyOf:
          - type: object
            properties:
              full_name:
                type: string
              email:
                anyOf:
                - type: string
                - type: 'null'
              disabled:
                type: boolean
              groups:
                type: array
                items:
                  type: string
              roles:
                type: array
                items:
                  $ref: '#/components/schemas/SystemRole'
              in_access_group:
                type: boolean
            required:
            - full_name
            - email
            - disabled
            - groups
            - roles
            - in_access_group
            additionalProperties: false
          - type: 'null'
      required:
      - ok
      - elapsed_ms
      additionalProperties: false
    SwitchModeRequest:
      type: object
      properties:
        mode:
          type: string
          enum:
          - ad
          - local
        dry_run:
          type: boolean
          default: true
      required:
      - mode
      additionalProperties: false
    SwitchCandidate:
      type: object
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        login:
          type: string
        full_name:
          type: string
        ad_candidates:
          type: array
          items:
            type: object
            properties:
              object_guid:
                $ref: '#/components/schemas/Uuid'
              login:
                type: string
              full_name:
                type: string
            required:
            - object_guid
            - login
            - full_name
            additionalProperties: false
      required:
      - user_id
      - login
      - full_name
      - ad_candidates
      additionalProperties: false
    SwitchReport:
      type: object
      properties:
        matched:
          type: array
          items:
            $ref: '#/components/schemas/SwitchCandidate'
        ambiguous:
          type: array
          items:
            $ref: '#/components/schemas/SwitchCandidate'
        not_found:
          type: array
          items:
            $ref: '#/components/schemas/SwitchCandidate'
        applied:
          type: boolean
      required:
      - matched
      - ambiguous
      - not_found
      - applied
      additionalProperties: false
    SwitchResolve:
      type: object
      properties:
        decisions:
          type: array
          items:
            type: object
            properties:
              user_id:
                $ref: '#/components/schemas/Uuid'
              object_guid:
                anyOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
            required:
            - user_id
            - object_guid
            additionalProperties: false
          minItems: 1
          description: object_guid = null — отклонить сопоставление
      required:
      - decisions
      additionalProperties: false
    AdminAccount:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        login:
          type: string
        full_name:
          type: string
        email:
          anyOf:
          - type: string
          - type: 'null'
        roles:
          type: array
          items:
            type: string
            enum:
            - superadmin
            - admin
            - security_auditor
        status:
          type: string
          enum:
          - active
          - blocked
          - pending_password
        totp_enabled:
          type: boolean
        last_login_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      required:
      - id
      - login
      - full_name
      - email
      - roles
      - status
      - totp_enabled
      - last_login_at
      additionalProperties: false
    AdminAccountCreate:
      type: object
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 64
        email:
          type: string
          format: email
          maxLength: 254
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        role:
          type: string
          enum:
          - superadmin
          - admin
          - security_auditor
        ad_object_guid:
          anyOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
      required:
      - login
      - email
      - full_name
      - role
      additionalProperties: false
    AdminAccountPatch:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
            enum:
            - superadmin
            - admin
            - security_auditor
        status:
          type: string
          enum:
          - active
          - blocked
      additionalProperties: false
    ActivationLink:
      type: object
      properties:
        emailed:
          type: boolean
        activation_url:
          anyOf:
          - type: string
            description: Только если SMTP не настроен или нет email (FR-AUTH-LOC-01)
          - type: 'null'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - emailed
      - activation_url
      - expires_at
      additionalProperties: false
    RegistryProject:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        customer:
          type: string
        moderators:
          type: array
          items:
            $ref: '#/components/schemas/UserRef'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        no_moderator_since:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        days_without_moderator:
          anyOf:
          - type: integer
          - type: 'null'
      required:
      - id
      - name
      - customer
      - moderators
      - status
      - created_at
      - updated_at
      - no_moderator_since
      - days_without_moderator
      additionalProperties: false
      description: Реестр без денег (FR-ADM-06, 7.5)
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
        ts:
          $ref: '#/components/schemas/Timestamp'
        event_type:
          type: string
        category:
          type: string
        result:
          type: string
          enum:
          - success
          - failure
          - denied
        user_id:
          anyOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        login:
          anyOf:
          - type: string
          - type: 'null'
        ip:
          anyOf:
          - type: string
          - type: 'null'
        user_agent:
          anyOf:
          - type: string
          - type: 'null'
        object_type:
          anyOf:
