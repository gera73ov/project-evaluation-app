    Diff:
      type: object
      properties:
        base:
          type: object
          properties:
            snapshot_id:
              anyOf:
              - $ref: '#/components/schemas/Uuid'
              - type: 'null'
            label:
              type: string
            totals:
              $ref: '#/components/schemas/HoursTotals'
          required:
          - snapshot_id
          - label
          - totals
          additionalProperties: false
        with:
          type: object
          properties:
            snapshot_id:
              anyOf:
              - $ref: '#/components/schemas/Uuid'
              - type: 'null'
            label:
              type: string
            totals:
              $ref: '#/components/schemas/HoursTotals'
          required:
          - snapshot_id
          - label
          - totals
          additionalProperties: false
        rows:
          type: array
          items:
            type: object
            properties:
              node_id:
                $ref: '#/components/schemas/Uuid'
              change:
                type: string
                enum:
                - added
                - removed
                - changed
                - moved
              title:
                type: string
              path:
                type: array
                items:
                  type: string
              before:
                anyOf:
                - $ref: '#/components/schemas/DiffEstimate'
                - type: 'null'
                description: Оценка в base; null — узла там нет (added)
              after:
                anyOf:
                - $ref: '#/components/schemas/DiffEstimate'
                - type: 'null'
                description: Оценка в with; null — узла там нет (removed)
              delta_e:
                $ref: '#/components/schemas/SignedHoursString'
              fields:
                type: array
                items:
                  type: string
              last_changed_by:
                anyOf:
                - $ref: '#/components/schemas/UserRef'
                - type: 'null'
              last_changed_at:
                anyOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
            required:
            - node_id
            - change
            - title
            - path
            - before
            - after
            - delta_e
            - fields
            - last_changed_by
            - last_changed_at
            additionalProperties: false
        params:
          type: array
          items:
            $ref: '#/components/schemas/DiffParam'
          description: Изменённые параметры проекта; денежных строк нет у ролей без денег
        pm:
          anyOf:
          - type: object
            properties:
              percent_before:
                $ref: '#/components/schemas/DecimalString'
              percent_after:
                $ref: '#/components/schemas/DecimalString'
              delta_e:
                $ref: '#/components/schemas/SignedHoursString'
            required:
            - percent_before
            - percent_after
            - delta_e
            additionalProperties: false
          - type: 'null'
          description: 'Строка-пояснение под таблицей: УП пересчитано (11.12), процент и ΔE УП; null — часы УП не изменились'
        totals_delta:
          $ref: '#/components/schemas/SignedHoursTotals'
        money:
          $ref: '#/components/schemas/DiffMoney'
      required:
      - base
      - with
      - rows
      - params
      - pm
      - totals_delta
      additionalProperties: false
      description: 'Сравнение: base — снимок {id}, with — снимок или текущее состояние («было → стало»);
        все разницы — with − base (FR-SNAP-03, 11.12; CR-008)'
    ExportKind:
      type: string
      enum:
      - hours_xlsx
      - money_xlsx
      - cq_xlsx
      - cq_docx
      - snapshot_diff_xlsx
      - stats_tab_xlsx
      - assumptions_docx
      - portfolio_xlsx
      - audit_csv
      description: Виды выгрузок — contracts/exports.yaml (EXP-001)
    ExportCreate:
      type: object
      properties:
        kind:
          type: string
          enum:
          - hours_xlsx
          - money_xlsx
        snapshot_id:
          anyOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
      required:
      - kind
      additionalProperties: false
    ExportJob:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/ExportKind'
        status:
          type: string
          enum:
          - pending
          - ready
        file_name:
          anyOf:
          - type: string
          - type: 'null'
        download_url:
          anyOf:
          - type: string
          - type: 'null'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
      - kind
      - status
      - file_name
      - download_url
      - expires_at
      additionalProperties: false
    Notification:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          description: Вид из contracts/notifications.yaml (NTF-001)
        project_id:
          anyOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        node_id:
          anyOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        payload:
          type: object
          properties: {}
        created_at:
          $ref: '#/components/schemas/Timestamp'
        read_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      required:
      - id
      - kind
      - project_id
      - node_id
      - payload
      - created_at
      - read_at
      additionalProperties: false
    NotificationsRead:
      type: object
      properties:
