# API-002 · OpenAPI-контракт v1. Владелец — трек API. Изменения — по contracts/README.md.
openapi: 3.1.0
info:
  title: Приложение оценки проектов — API v1
  version: 1.0.0
  description: 'Контракт API-002 (владелец — трек API), версия 1.0.0 утверждена PM-001 (веха M0). Основание — SPEC v0.5, 15.2–15.4. Соглашения
    — contracts/api-conventions.md, коды ошибок — contracts/errors.yaml, права x-permission — contracts/permissions.yaml (SEC-001).
    Расширения: x-permission — право или список «любое из»; x-error-codes — коды ошибок операции; x-spec — требования SPEC;
    x-spec-gap — путь добавлен решением GAP-02 или GAP-13; x-step-up, x-totp-gate, x-network-restricted — флаги прав. Денежные поля —
    только в схемах *Money (ключ money отсутствует без права, SEC-AUTHZ-04).'
servers:
- url: /api/v1
security:
- session: []
tags:
- name: Вход и профиль
- name: Система
- name: Администратор
- name: Руководитель пресейла
- name: Проекты
- name: Дерево
- name: Обсуждения
- name: Статистика, снимки, экспорт
- name: Уведомления
paths:
  /auth/login:
    post:
      operationId: login
      summary: Вход по логину и паролю
      tags:
      - Вход и профиль
      x-permission: public
      x-spec:
      - '7.2'
      - FR-AUTH-AD-13
      - FR-LOCK-01..05
      - FR-SESS-01
      - FR-SESS-03
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-error-codes:
      - VALIDATION_FAILED
      - LOGIN_FAILED
      - LOGIN_LOCKED
      - RATE_LIMITED
      - AUTH_SERVICE_UNAVAILABLE
      - APP_SETUP_IN_PROGRESS
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Problem401'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '503':
          $ref: '#/components/responses/Problem503'
        '500':
          $ref: '#/components/responses/Problem500'
      security: []
  /auth/options:
    get:
      operationId: getAuthOptions
      summary: Режим входа для экрана входа (до входа)
      description: 'CR-001. Публичный: без сессии и CSRF. Экран входа узнаёт режим до первой попытки входа — подсказка
        «учётная запись компании» и отсутствие «Забыли пароль?» в режиме AD (SPEC 11.1 №3–5). Тот же режим отдают
        GET /me и расширение auth_mode ошибки LOGIN_FAILED.'
      tags:
      - Вход и профиль
      x-permission: public
      x-spec:
      - '11.1'
      - FR-AUTH-AD-13
      x-error-codes:
      - RATE_LIMITED
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthOptions'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
      security: []
  /auth/totp:
    post:
      operationId: loginTotp
      summary: 'Второй шаг входа: код TOTP или резервный код'
      tags:
      - Вход и профиль
      x-permission: token.login_step
      x-spec:
      - FR-2FA-01
      - FR-LOCK-03
      - FR-SESS-03
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpLoginRequest'
      x-error-codes:
      - VALIDATION_FAILED
      - TOTP_INVALID
      - LOGIN_STEP_EXPIRED
      - LOGIN_LOCKED
      - RATE_LIMITED
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Problem401'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
      security: []
  /auth/logout:
    post:
      operationId: logout
      summary: Выход
      tags:
      - Вход и профиль
      x-permission:
      - authenticated
      - session.pre_mfa
      - session.password_change
      x-spec:
      - FR-SESS-01
      x-error-codes:
      - UNAUTHENTICATED
      - CSRF_FAILED
      responses:
        '204':
          description: Выполнено
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '500':
          $ref: '#/components/responses/Problem500'
  /auth/totp/enroll:
    post:
      operationId: totpEnrollStart
      summary: 'Принудительное подключение TOTP: QR и секрет'
      tags:
      - Вход и профиль
      x-permission: session.pre_mfa
      x-spec:
      - FR-2FA-04
      x-error-codes:
      - UNAUTHENTICATED
      - TOTP_ENROLL_REQUIRED
      - PASSWORD_CHANGE_REQUIRED
      - CSRF_FAILED
      - RATE_LIMITED
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollStart'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /auth/totp/enroll/confirm:
    post:
      operationId: totpEnrollConfirm
      summary: Подтверждение первым кодом, выдача резервных кодов
      tags:
      - Вход и профиль
      x-permission: session.pre_mfa
      x-spec:
      - FR-2FA-01
      - FR-2FA-04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCode'
      x-error-codes:
      - UNAUTHENTICATED
      - TOTP_ENROLL_REQUIRED
      - PASSWORD_CHANGE_REQUIRED
      - CSRF_FAILED
      - RATE_LIMITED
      - VALIDATION_FAILED
      - TOTP_INVALID
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupCodes'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /auth/step-up:
    post:
      operationId: stepUp
      summary: 'Step-up: пароль и TOTP или только TOTP для денег'
      tags:
      - Вход и профиль
      x-permission: authenticated
      x-spec:
      - SEC-AUTH-05
      - FR-2FA-05
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
      x-error-codes:
      - UNAUTHENTICATED
      - TOTP_ENROLL_REQUIRED
      - PASSWORD_CHANGE_REQUIRED
      - CSRF_FAILED
      - RATE_LIMITED
      - VALIDATION_FAILED
      - STEP_UP_FAILED
      - LOGIN_LOCKED
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpResponse'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /auth/activate:
    post:
      operationId: activate
      summary: Установка пароля по ссылке активации
      tags:
      - Вход и профиль
      x-permission: token.activation
      x-spec:
      - FR-SA-01
      - FR-AUTH-LOC-01
      - SEC-AUTH-03
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPassword'
      x-error-codes:
      - VALIDATION_FAILED
      - TOKEN_INVALID
      - PASSWORD_POLICY_VIOLATION
      - RATE_LIMITED
      responses:
        '204':
          description: Выполнено
        '410':
          $ref: '#/components/responses/Problem410'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
      security: []
  /auth/password/forgot:
    post:
      operationId: passwordForgot
      summary: '«Забыли пароль»: ответ всегда одинаковый'
      tags:
      - Вход и профиль
      x-permission: public
      x-spec:
      - FR-AUTH-LOC-03
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotRequest'
      x-error-codes:
      - VALIDATION_FAILED
      - RATE_LIMITED
      responses:
        '204':
          description: Выполнено
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
      security: []
  /auth/password/reset:
    post:
      operationId: passwordReset
      summary: Сброс пароля по ссылке
      tags:
      - Вход и профиль
      x-permission: token.activation
      x-spec:
      - FR-AUTH-LOC-03
      - SEC-AUTH-03
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPassword'
      x-error-codes:
      - VALIDATION_FAILED
      - TOKEN_INVALID
      - PASSWORD_POLICY_VIOLATION
      - RATE_LIMITED
      responses:
        '204':
          description: Выполнено
        '410':
          $ref: '#/components/responses/Problem410'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
      security: []
  /me:
    get:
      operationId: getMe
      summary: Профиль текущего пользователя
      tags:
      - Вход и профиль
      x-permission: authenticated
      x-spec:
      - '15.2'
      x-error-codes:
      - UNAUTHENTICATED
      - TOTP_ENROLL_REQUIRED
      - PASSWORD_CHANGE_REQUIRED
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '500':
          $ref: '#/components/responses/Problem500'
    patch:
      operationId: patchMe
      summary: Изменить ФИО (только local) и часовой пояс
      tags:
      - Вход и профиль
      x-permission: authenticated
      x-spec:
      - '15.2'
      - FR-UI-02
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MePatch'
      x-error-codes:
      - UNAUTHENTICATED
      - TOTP_ENROLL_REQUIRED
      - PASSWORD_CHANGE_REQUIRED
      - CSRF_FAILED
      - RATE_LIMITED
      - VALIDATION_FAILED
      - FORBIDDEN
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /me/sessions:
    get:
      operationId: listMySessions
      summary: Активные сессии
      tags:
      - Вход и профиль
      x-permission: authenticated
      x-spec:
      - FR-SESS-04
      x-error-codes:
      - UNAUTHENTICATED
      - TOTP_ENROLL_REQUIRED
      - PASSWORD_CHANGE_REQUIRED
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                required:
                - items
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '500':
          $ref: '#/components/responses/Problem500'
    delete:
      operationId: deleteMySessions
      summary: Завершить сессии, кроме текущей
      tags:
      - Вход и профиль
      x-permission: authenticated
      x-spec:
      - FR-SESS-04
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
        description: Одна сессия; без параметра — все, кроме текущей
      x-error-codes:
      - UNAUTHENTICATED
      - TOTP_ENROLL_REQUIRED
      - PASSWORD_CHANGE_REQUIRED
      - CSRF_FAILED
      - RATE_LIMITED
      responses:
        '204':
          description: Выполнено
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /me/password:
    post:
      operationId: changePassword
      summary: Смена пароля (local), в том числе истёкшего при входе
      tags:
      - Вход и профиль
      x-permission:
      - authenticated
      - session.password_change
      x-spec:
      - FR-AUTH-LOC-04
      - FR-AUTH-LOC-02
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      x-error-codes:
      - UNAUTHENTICATED
      - TOTP_ENROLL_REQUIRED
      - CSRF_FAILED
      - RATE_LIMITED
      - VALIDATION_FAILED
      - FORBIDDEN
      - CURRENT_PASSWORD_INVALID
      - PASSWORD_POLICY_VIOLATION
      responses:
        '204':
          description: Выполнено
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /me/totp:
    post:
      operationId: enableTotp
      summary: Подключить TOTP по желанию (шаг 1 — QR; шаг 2 — код)
      tags:
      - Вход и профиль
      x-permission: authenticated
      x-spec:
      - FR-2FA-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: ^\d{6}$
              additionalProperties: false
      x-error-codes:
      - UNAUTHENTICATED
      - TOTP_ENROLL_REQUIRED
      - PASSWORD_CHANGE_REQUIRED
      - CSRF_FAILED
      - RATE_LIMITED
      - VALIDATION_FAILED
      - TOTP_INVALID
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/TotpEnrollStart'
                - $ref: '#/components/schemas/BackupCodes'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
    delete:
      operationId: disableTotp
      summary: Отключить TOTP (если не обязателен)
      tags:
      - Вход и профиль
      x-permission: me.totp.disable
      x-spec:
      - '15.2'
      - FR-2FA-02
      x-step-up: true
      x-error-codes:
      - UNAUTHENTICATED
      - TOTP_ENROLL_REQUIRED
      - PASSWORD_CHANGE_REQUIRED
      - FORBIDDEN
      - CSRF_FAILED
      - RATE_LIMITED
      - STEP_UP_REQUIRED
      responses:
        '204':
          description: Выполнено
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /me/backup-codes:
    post:
      operationId: regenerateBackupCodes
      summary: Новые резервные коды
      tags:
      - Вход и профиль
      x-permission: authenticated
      x-spec:
      - FR-2FA-01
      x-error-codes:
      - UNAUTHENTICATED
      - TOTP_ENROLL_REQUIRED
      - PASSWORD_CHANGE_REQUIRED
      - CSRF_FAILED
      - RATE_LIMITED
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupCodes'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /me/notification-settings:
    get:
      operationId: getNotificationSettings
      summary: Настройки писем
      tags:
      - Вход и профиль
      x-permission: authenticated
      x-spec:
      - FR-NOTIF-02
      x-error-codes:
      - UNAUTHENTICATED
      - TOTP_ENROLL_REQUIRED
      - PASSWORD_CHANGE_REQUIRED
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '500':
          $ref: '#/components/responses/Problem500'
    put:
      operationId: putNotificationSettings
      summary: Изменить настройки писем
      tags:
      - Вход и профиль
      x-permission: authenticated
      x-spec:
      - FR-NOTIF-02
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettings'
      x-error-codes:
      - UNAUTHENTICATED
      - TOTP_ENROLL_REQUIRED
      - PASSWORD_CHANGE_REQUIRED
      - CSRF_FAILED
      - RATE_LIMITED
      - VALIDATION_FAILED
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /me/view-state/{project_id}:
    get:
      operationId: getViewState
      summary: Состояние вида проекта
      tags:
      - Вход и профиль
      x-permission: project.read
      x-spec:
      - FR-TREE-14
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      x-error-codes:
      - UNAUTHENTICATED
      - TOTP_ENROLL_REQUIRED
      - PASSWORD_CHANGE_REQUIRED
      - NOT_FOUND
      - FORBIDDEN
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewState'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
    put:
      operationId: putViewState
      summary: Сохранить состояние вида
      tags:
      - Вход и профиль
      x-permission: project.read
      x-spec:
      - FR-TREE-14
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewState'
      x-error-codes:
      - UNAUTHENTICATED
      - TOTP_ENROLL_REQUIRED
      - PASSWORD_CHANGE_REQUIRED
      - NOT_FOUND
      - FORBIDDEN
      - CSRF_FAILED
      - RATE_LIMITED
      - VALIDATION_FAILED
      - PAYLOAD_TOO_LARGE
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewState'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /system/setup/{step}:
    get:
      operationId: getSetupStep
      summary: Шаг мастера первичной настройки
      tags:
      - Система
      x-permission: system.setup
      x-spec:
      - '7.1'
      - FR-SA-02
      x-network-restricted: true
      parameters:
      - name: step
        in: path
        required: true
        schema:
          type: string
      x-error-codes:
      - UNAUTHENTICATED
