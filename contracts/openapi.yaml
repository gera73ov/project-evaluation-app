      - to
      additionalProperties: false
  responses:
    Problem400:
      description: 'Некорректный запрос. Коды: MALFORMED_REQUEST, CURSOR_INVALID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem401:
      description: 'Требуется вход или неверные данные. Коды: UNAUTHENTICATED, LOGIN_FAILED, LOGIN_STEP_EXPIRED, TOTP_INVALID,
        STEP_UP_FAILED'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem403:
      description: 'Нет доступа. Коды: PASSWORD_CHANGE_REQUIRED, TOTP_ENROLL_REQUIRED, TOTP_REQUIRED, STEP_UP_REQUIRED, CSRF_FAILED, FORBIDDEN'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem404:
      description: 'Не найдено. Коды: NOT_FOUND'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem409:
      description: 'Конфликт с состоянием. Коды: FIELD_CONFLICT, NODES_LIMIT, RESTORE_TARGET_UNAVAILABLE, BRANCH_NOT_READY,
        BRANCH_NOT_EMPTY, INVALID_TRANSITION, PROJECT_STATUS_CONFLICT, CONFIRMATION_REQUIRED, CROSS_CUTTING_PHASE_LOCKED,
        LAST_MODERATOR, LAST_SUPERADMIN, SUPERADMIN_LIMIT, ROLE_INCOMPATIBLE, ALREADY_EXISTS, USER_NOT_BLOCKED, AD_USER_NOT_IN_GROUP,
        DICTIONARY_IN_USE, SETUP_ALREADY_COMPLETED, AD_CHECKS_REQUIRED, MODE_SWITCH_NOT_ALLOWED, MODE_SWITCH_UNRESOLVED, MESSAGE_HAS_REPLIES,
        PROJECT_STORAGE_LIMIT, DOCUMENT_NOT_AVAILABLE, EXPORT_FAILED'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem410:
      description: 'Больше недоступно. Коды: TOKEN_INVALID, VERSION_TOO_OLD, EXPORT_EXPIRED'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem413:
      description: 'Слишком большой запрос. Коды: PAYLOAD_TOO_LARGE'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem415:
      description: 'Недопустимый тип. Коды: UNSUPPORTED_MEDIA_TYPE'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem422:
      description: 'Ошибка в данных. Коды: VALIDATION_FAILED, VALUE_OUT_OF_RANGE, PASSWORD_POLICY_VIOLATION, CURRENT_PASSWORD_INVALID,
        NODE_HAS_CHILDREN, DEPTH_LIMIT, MEMBER_ROLE_REQUIRED, MEMBER_LIMIT'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem423:
      description: 'Занято другим пользователем. Коды: CELL_LOCKED'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem429:
      description: 'Слишком много запросов. Коды: RATE_LIMITED, LOGIN_LOCKED, REMIND_TOO_OFTEN'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem500:
      description: 'Внутренняя ошибка. Коды: INTERNAL_ERROR'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem503:
      description: 'Недоступно. Коды: SERVICE_UNAVAILABLE, APP_SETUP_IN_PROGRESS, AUTH_SERVICE_UNAVAILABLE'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
