# INF-012 · pgBackRest (SPEC 18.2, NFR-REL-02, NFR-REL-06, SEC-CRYPT-04, SEC-CRYPT-07).
# Копии и архив WAL — в /var/lib/pgbackrest (том backups; на stage и prod — отдельный диск или
# сетевое хранилище службы эксплуатации, см. deploy/backup/README.md).
# Шифрование AES-256: пароль репозитория — переменная PGBACKREST_REPO1_CIPHER_PASS
# (из BACKUP_CIPHER_PASS, Docker secret на stage и prod); он хранится отдельно от копий —
# запечатанная копия в сейфе ИБ (SEC-CRYPT-07). Без пароля копии не читаются.
# Хранение: полные копии 30 дней (retention-full-type=time), WAL — пока нужны этим копиям.
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=30
compress-type=zst
start-fast=y
archive-async=n
log-level-console=info
log-level-file=off
lock-path=/tmp/pgbackrest

[estimator]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=estimator
