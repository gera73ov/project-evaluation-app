# INF-004/INF-006 · основной конфиг Nginx: процесс не от root, файловая система только для чтения.
# Полная настройка (заголовки SEC-WEB-03, CSP с nonce, лимиты SEC-WEB-08) — INF-009.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    log_format json escape=json '{"time":"$time_iso8601","level":"info","event":"http_access",'
        '"request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
        '"upstream_s":"$upstream_response_time"}';
    access_log /dev/stdout json;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    include /etc/nginx/conf.d/*.conf;
}
