# Заглушка реплики api для deploy/nginx/test_nginx.sh: отвечает JSON и показывает,
# какие заголовки пришли от Nginx.
server {
    listen 8000;
    client_max_body_size 0; # лимиты проверяет Nginx перед заглушкой
    # Ответ дерева длиннее порога сжатия (gzip_min_length в conf.d/estimator.conf)
    location ~ /tree$ {
        default_type application/json;
        return 200 '{"nodes":"$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id$request_id"}';
    }
    location / {
        default_type application/json;
        return 200 '{"ok":true,"proto":"$http_x_forwarded_proto","request_id":"$http_x_request_id"}';
    }
}
