# SEC-009 · формат access-лога Nginx (SEC-AUTH-04, CL-11, NFR-MNT-04).
# В лог не попадают строка запроса ($request, $request_uri, $args, $arg_*), cookie,
# заголовок Authorization и тело запроса: в них бывают токены активации и сброса пароля,
# идентификатор сессии и CSRF-токен. Путь — $uri (нормализованный, без строки запроса).
# Проверка — deploy/nginx/test_log_format.py.
log_format json escape=json '{"time":"$time_iso8601","level":"info","event":"http_access",'
    '"request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
    '"upstream_s":"$upstream_response_time"}';
