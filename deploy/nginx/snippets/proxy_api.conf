# INF-009 · прокси REST к репликам api. Заголовки безопасности ставит само приложение
# (SEC-007, SecurityHeadersMiddleware) — здесь добавляется только HSTS, которого у него нет.
proxy_pass http://estimator_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Request-ID $request_id;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_connect_timeout 5s; # реплика недоступна — быстро 503 (или следующая реплика)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
