# INF-009 · общая часть ошибок Nginx в формате Problem Details (contracts/api-conventions.md 5).
# error_id — $request_id: тот же идентификатор есть в access-логе Nginx и в X-Request-ID.
types { } # иначе тип берётся из расширения пути (.js у отсутствующего файла сборки)
default_type application/problem+json;
include /etc/nginx/snippets/security_headers.conf;
add_header Cache-Control "no-store" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
