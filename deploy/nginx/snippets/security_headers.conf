# INF-009 · заголовки безопасности SEC-WEB-01/03 для ответов самого Nginx: статика, index.html,
# его страницы ошибок. Подключается в КАЖДЫЙ location со своими add_header: в Nginx директивы
# add_header не наследуются, если в блоке есть хотя бы одна своя. `always` — и на 4xx/5xx (CL-05).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
