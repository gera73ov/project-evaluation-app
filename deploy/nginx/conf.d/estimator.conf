# INF-004, INF-009 · сайт приложения: TLS, статика SPA с CSP-nonce, прокси REST и WebSocket к
# репликам api, лимиты тела, заголовки на статике и ошибках. SPEC SEC-WEB-01/03/08, CL-05, 13.1.
# /health/* и /metrics наружу не отдаются (NFR-MNT-05). Проверка — deploy/nginx/test_nginx.sh.

upstream estimator_api {
    # Имя сервиса compose разрешается во все реплики api (SPEC 13.2: две реплики)
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# connect-src для WebSocket: только корректное имя хоста, иначе Host мог бы дописать в CSP
# свои директивы. Некорректный Host — без wss (WebSocket тогда не подключится, и это верно).
map $host $csp_wss {
    "~^[a-z0-9.-]+$"  " wss://$host";
    default           "";
}

# Лимит тела для ответа 413 (SEC-WEB-08; совпадает с client_max_body_size по location ниже и с
# BODY_LIMITS приложения). map, а не set: размер проверяется до фазы rewrite.
map $uri $body_limit_bytes {
    default                                  1048576;
    /api/v1/system/settings/auth             65536;
    /api/v1/admin/calendar                   262144;
    "~^/api/v1/projects/[^/]+/documents$"    52428800;
}

# HTTP → 301 на HTTPS (SEC-WEB-01). Порт HTTPS снаружи — 443 (stage, prod).
server {
    listen 8080 default_server;
    server_name _;
    include /etc/nginx/snippets/security_headers.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    # Сертификат dev-стенда выпускает сервис certs (deploy/compose); на stage и prod — свой
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    # Mozilla «intermediate» (SEC-WEB-01): TLS 1.2 и 1.3; наборы TLS 1.2 — только ECDHE с AEAD
    # (DHE из профиля не включены: без своих параметров DH они не нужны)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    client_max_body_size 1m;

    # Ошибки самого Nginx — Problem Details с заголовками (CL-05). Ошибки приложения проходят
    # как есть (proxy_intercept_errors off): у них свои error_id и заголовки.
    error_page 413 @payload_too_large;
    error_page 502 503 504 =503 @service_unavailable;
    error_page 404 @not_found;

    location @payload_too_large {
        include /etc/nginx/snippets/problem.conf;
        return 413 '{"type":"https://estimator.local/problems/payload-too-large","title":"Слишком большой запрос","status":413,"code":"PAYLOAD_TOO_LARGE","error_id":"$request_id","limit_bytes":$body_limit_bytes}';
    }
    location @service_unavailable {
        include /etc/nginx/snippets/problem.conf;
        return 503 '{"type":"https://estimator.local/problems/service-unavailable","title":"Сервис временно недоступен","status":503,"code":"SERVICE_UNAVAILABLE","error_id":"$request_id"}';
    }
    location @not_found {
        include /etc/nginx/snippets/problem.conf;
        return 404 '{"type":"https://estimator.local/problems/not-found","title":"Не найдено","status":404,"code":"NOT_FOUND","error_id":"$request_id"}';
    }

    location = /metrics { return 404; }
    location ^~ /health/ { return 404; }

    location = /api/v1/ws {
        proxy_pass http://estimator_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Лимиты тела по SEC-WEB-08: 64 КБ (сертификат УЦ в настройках auth), 256 КБ (календарь),
    # 50 МБ (документы заказчика); остальное — 1 МБ
    location = /api/v1/system/settings/auth {
        client_max_body_size 64k;
        include /etc/nginx/snippets/proxy_api.conf;
    }
    location = /api/v1/admin/calendar {
        client_max_body_size 256k;
        include /etc/nginx/snippets/proxy_api.conf;
    }
    location ~ ^/api/v1/projects/[^/]+/documents$ {
        client_max_body_size 50m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        include /etc/nginx/snippets/proxy_api.conf;
    }
    location /api/ {
        include /etc/nginx/snippets/proxy_api.conf;
    }

    # Сборка Vite: имена с хэшем, кэш на год; CSP запрещающая (это не страницы)
    location /assets/ {
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # index.html для любых маршрутов SPA: свежий nonce на каждый ответ (SEC-WEB-03).
    # $request_id — 128 случайных бит; подставляется в CSP и вместо __CSP_NONCE__ в
    # <meta name="csp-nonce">, откуда его берёт кэш Emotion (frontend/src/shared/ui/theme.ts).
    location / {
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
    location = /index.html {
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; connect-src 'self'$csp_wss; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
        sub_filter_types text/html;
        sub_filter "__CSP_NONCE__" "$request_id";
        sub_filter_once off;
        etag off;
        if_modified_since off;
    }
}

# Проверка живости Nginx для healthcheck контейнера: только loopback, наружу не публикуется
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /nginx-health { return 200 "ok\n"; }
    location / { return 404; }
}
