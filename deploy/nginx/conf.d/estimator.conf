# INF-004 · сайт приложения: TLS, статика SPA, прокси REST и WebSocket к репликам api.
# /health/* и /metrics наружу не отдаются (NFR-MNT-05).

upstream estimator_api {
    # Имя сервиса compose разрешается во все реплики api (SPEC 13.2: две реплики)
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    # Сертификат dev-стенда выпускает сервис certs (deploy/compose); на stage и prod — свой
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /usr/share/nginx/html;

    location = /metrics { return 404; }
    location ^~ /health/ { return 404; }

    location = /api/v1/ws {
        proxy_pass http://estimator_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://estimator_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.html;
    }
}

# Проверка живости Nginx для healthcheck контейнера: только loopback, наружу не публикуется
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /nginx-health { return 200 "ok\n"; }
    location / { return 404; }
}
