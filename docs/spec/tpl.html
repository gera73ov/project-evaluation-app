<title>SPEC приложения оценки</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: технический документ — закреплённое оглавление слева, колонка текста ~ 820px справа */
:root {
  --bg: #f7f8f9;
  --paper: #ffffff;
  --ink: #1b2229;
  --muted: #5b6672;
  --line: #dde2e7;
  --accent: #1f6f8b;
  --accent-soft: #e5f1f5;
  --note: #f3f6ee;
  --note-line: #7c9a4a;
  --code-bg: #f1f3f5;
  --font-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171c; --paper: #182027; --ink: #e3e8ed; --muted: #9aa6b2; --line: #2b3640;
  --accent: #6cbad6; --accent-soft: #1d3440; --note: #1e2a1c; --note-line: #9cc068; --code-bg: #0f1418; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12171c; --paper: #182027; --ink: #e3e8ed; --muted: #9aa6b2; --line: #2b3640;
  --accent: #6cbad6; --accent-soft: #1d3440; --note: #1e2a1c; --note-line: #9cc068; --code-bg: #0f1418; color-scheme: dark }

html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 40px; max-width: 1240px; margin: 0 auto; padding-block: 32px 80px; }
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); align-self: start; max-height: calc(100vh - 40px); overflow-y: auto; font-size: 13.5px; }
nav.toc .label { text-transform: uppercase; letter-spacing: .08em; font-size: 11.5px; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
nav.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
nav.toc a { display: block; color: var(--muted); text-decoration: none; padding: 4px 10px; border-left: 2px solid var(--line); }
nav.toc a:hover, nav.toc a:focus-visible { color: var(--accent); border-left-color: var(--accent); outline: none; }
main { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 40px clamp(18px, 4vw, 56px); min-width: 0; }
main > * { max-width: 820px; }
main > .tablewrap, main > .diagram, main > .codewrap { max-width: none; }
h1 { font-size: 30px; line-height: 1.2; margin: 0 0 20px; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-size: 23px; line-height: 1.25; margin: 56px 0 14px; padding-top: 18px; border-top: 1px solid var(--line); text-wrap: balance; scroll-margin-top: 16px; }
h3 { font-size: 18px; margin: 34px 0 10px; text-wrap: balance; scroll-margin-top: 16px; }
h4 { font-size: 15.5px; margin: 26px 0 8px; color: var(--accent); }
p, li { max-width: 72ch; }
a { color: var(--accent); }
hr { display: none; }
code { overflow-wrap: anywhere; font-family: var(--font-mono); font-size: .86em; background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }
.codewrap { overflow-x: auto; background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; margin: 14px 0; }
.codewrap pre { margin: 0; padding: 14px 16px; }
.codewrap code { background: none; padding: 0; font-size: 12.5px; line-height: 1.22; white-space: pre; }
.tablewrap { overflow-x: auto; margin: 14px 0 18px; border: 1px solid var(--line); border-radius: 5px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
th { background: var(--accent-soft); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
blockquote { margin: 16px 0; padding: 10px 16px; background: var(--note); border-left: 3px solid var(--note-line); border-radius: 0 5px 5px 0; }
blockquote p { margin: 4px 0; }
.rid { font-family: var(--font-mono); font-size: .82em; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 3px; margin-right: 4px; white-space: nowrap; }
.diagram { overflow-x: auto; margin: 16px 0 20px; padding: 16px; border: 1px dashed var(--line); border-radius: 5px; }
.diagram pre.mermaid { margin: 0; background: none; }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 16px 48px; }
  nav.toc { display: none; }
  main { padding: 24px 16px; }
}
</style>
<div class="shell">
  <nav class="toc" aria-label="Оглавление">
    <div class="label">Разделы</div>
    <ol>
{{TOC}}
    </ol>
  </nav>
  <main>
{{BODY}}
  </main>
</div>
