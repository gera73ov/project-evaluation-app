# gitleaks (SEC-SDLC-01): стандартные правила плюс узкие исключения для фиктивных значений
# в тестах. Исключение — только точное тестовое значение, не файл и не правило: настоящий
# секрет в тех же файлах по-прежнему ловится. История сканируется целиком, поэтому значение
# из уже опубликованного коммита исключается здесь, а не переписыванием истории (AGENTS.md 5.9).
[extend]
useDefault = true

[[allowlists]]
description = "SEC-009: фиктивные пароль, токен и id сессии в тесте фильтров логов (test_logfilter.py)"
regexes = [
  '''Zk3q9V0pQd1sXz7yW2rT4uI6oP8aS0dF''',
  '''Tr0ub4dor&3-very-secret''',
  '''s3ss10n-1d-0123456789abcdef''',
]

[[allowlists]]
description = "AUTH-011: фиктивный пароль в тесте консольных команд (коммит 9ea83f5, test_superadmin_cli.py); теперь в тесте другое значение"
regexes = [
  '''Vremennyi-parol-2026''',
]

[[allowlists]]
description = "SEC-012: заголовок PEM без ключа («-----BEGIN PRIVATE KEY-----» дважды) в тесте настроек SIEM (коммит 981bf02, test_siem_format.py); теперь в тесте другое значение, ключи mTLS генерируются в тестах на лету"
commits = ["981bf024375ab0123949444084e9628b906f7d44"]
paths = ['''backend/tests/unit/sec/test_siem_format\.py''']
condition = "AND"
