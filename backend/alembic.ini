# DB-002 · конфигурация Alembic. Адрес БД берётся из DATABASE_URL (estimator.config), не отсюда:
# в репозитории секретов нет (SEC-CRYPT-01). Запуск: `estimator migrate` или `alembic upgrade head`
# из каталога backend/. Правила миграций — alembic/README.md.
[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os
truncate_slug_length = 40
# Одна транзакция на весь прогон: при ошибке откатываются все миграции прогона
transaction_per_migration = false

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
