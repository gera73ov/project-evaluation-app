# INF-005 · изолированное окружение semgrep (SEC-SDLC-01). Отдельно от бэкенда, потому что
# semgrep закрепляет opentelemetry-api <1.38, а FastAPI требует >=1.44.
# Запуск: `uv run --project tools/semgrep --frozen semgrep …` (см. Makefile).
[project]
name = "estimator-semgrep"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = ["semgrep==1.182.0"]

[tool.uv]
package = false
exclude-newer = "2026-10-22T00:00:00Z"
