# INF-005 · проверки на каждый PR и push в main (SEC-SDLC-01, NFR-MNT-01).
# Бесплатный тариф GitHub: лёгкие проверки здесь, сборка образов, trivy и смоук стенда — в
# images.yml (при изменении образов, раз в неделю и вручную). Решение владельца от 05.11.2026.
# Действия закреплены по SHA коммита (AGENTS.md 6.5); права токена — только чтение.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  UV_PYTHON: "3.12"
  UV_NO_PROGRESS: "1"

jobs:
  backend:
    name: backend (ruff, bandit, semgrep, pip-audit, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # QA-001: тесты с фикстурами БД получают свою базу на каждый процесс xdist. Сервер живёт
    # только на время задания и доступен с раннера, поэтому вход без пароля (trust).
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: estimator
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U estimator" --health-interval 2s
          --health-timeout 5s --health-retries 30
      # SEC-008, AUTH-002, AUTH-005: лимиты, блокировки и сессии проверяются на настоящем Redis
      redis:
        image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://estimator@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            backend/tools/semgrep/uv.lock
      - name: Установить зависимости из uv.lock
        run: uv sync --all-groups
      - name: ruff
        run: |
          uv run ruff check --output-format=github . ../deploy ../tools ../load
          uv run ruff format --check . ../deploy ../tools ../load
      - name: bandit
        run: uv run bandit -q -c pyproject.toml -r src ../deploy -x ../deploy/syslog/test_receiver.py
      - name: semgrep (самопроверка правил и скан)
        working-directory: .
        run: |
          uv run --project backend/tools/semgrep semgrep --test backend/semgrep/
          uv run --project backend/tools/semgrep semgrep scan --error --metrics=off \
            --disable-version-check --config backend/semgrep/ \
            --exclude "backend/semgrep/*.py" backend/src deploy
      - name: pip-audit (критичные и высокие блокируют)
        run: |
          uv export -q --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/req.txt"
          uv run pip-audit --strict --require-hashes --disable-pip -r "$RUNNER_TEMP/req.txt"
      - name: pytest параллельно, с покрытием (≥ 80 %, domain/calc и security/authz — 100 %)
        env:
          # API-004: отчёт «реализовано / не реализовано» по contracts/openapi.yaml
          API_CONTRACT_REPORT: ${{ runner.temp }}/api-contract-report.md
        run: |
          uv run pytest -n auto --cov --cov-report=term --cov-report=json:coverage.json
          uv run python scripts/check_coverage.py coverage.json
      - name: Опубликовать отчёт о реализации API (API-004)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-contract-report
          path: ${{ runner.temp }}/api-contract-report.md
          if-no-files-found: warn
          retention-days: 30
      - name: Отчёт трассировки «требование → тест» (QA-001, ворота QA-027)
        working-directory: .
        run: python3 tools/traceability.py --strict --require-all --output "$RUNNER_TEMP/traceability.md"
      - name: Таблица переменных окружения в README совпадает с конфигом (DOC-001)
        run: uv run estimator config-env --check ../README.md

  frontend:
    name: frontend (eslint, tsc, vitest, build, npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit
      - name: eslint + security
        run: npm run lint
      - name: tsc
        run: npm run typecheck
      - name: vitest
        run: npm test
      - name: build без inline-скриптов и внешних ресурсов
        run: npm run build
      - name: npm audit (критичные и высокие блокируют)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Установить gitleaks (проверка контрольной суммы)
        run: |
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks по всей истории
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'

  schema-compat:
    # INF-015 (SPEC 18.3, NFR-MNT-02): миграции expand совместимы с прежней версией кода — тесты
    # из main идут на схеме, которую накатывают миграции PR (TEST_ALEMBIC_DIR). Только для PR,
    # меняющих backend/alembic; тесты самих миграций (tests/integration/db) не запускаются.
    name: старый код на новой схеме
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: estimator
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U estimator" --health-interval 2s
          --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://estimator@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: new
          fetch-depth: 0
          persist-credentials: false
      - name: Есть ли новые миграции
        id: changed
        working-directory: new
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --quiet "$base" HEAD -- backend/alembic; then
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "::notice::Миграции в PR не менялись — проверка не нужна"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changed.outputs.run == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: old
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: steps.changed.outputs.run == 'true'
        with:
          version: "0.11.32"
      - name: Тесты main на схеме из PR
        if: steps.changed.outputs.run == 'true'
        working-directory: old/backend
        env:
          TEST_ALEMBIC_DIR: ${{ github.workspace }}/new/backend
        run: |
          if ! grep -q TEST_ALEMBIC_DIR tests/plugins/database.py; then
            echo "::notice::в main ещё нет TEST_ALEMBIC_DIR — проверка начнёт работать после слияния INF-015"
            exit 0
          fi
          uv sync --frozen --all-groups
          uv run --frozen pytest -n auto -p no:cacheprovider tests/integration tests/acceptance \
            --ignore=tests/integration/db -q

  ops:
    name: эксплуатация (правила оповещений, скрипты)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: promtool — синтаксис и имитация правил 18.4 (INF-013)
        run: |
          img=prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/m:ro" "$img" check rules /m/alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/m:ro" "$img" test rules /m/alerts.test.yml
      - name: shellcheck скриптов эксплуатации
        run: shellcheck -x -P SCRIPTDIR -S warning deploy/backup/*.sh deploy/scripts/*.sh deploy/logging/*.sh deploy/home-stand/*.sh deploy/envs/*.sh load/*.sh
