# QA-023 · совместимость браузеров и экранов (NFR-COMP-01, NFR-COMP-02, FR-UI-03) на домашнем
# стенде, только запуском вручную. Поднимает стенд профиля test тем же скриптом, что e2e-stand, и
# гоняет сквозные сценарии ролей (e2e/scenarios, QA-018) в каждом браузере на экране 1366×768:
# Chromium и Firefox из Playwright, а Chrome, Edge и Яндекс Браузер — если они установлены на
# машине стенда (без sudo их не поставить; чего нет — в сводке запуска).
# Правила безопасности те же, что у e2e-stand.yml: только workflow_dispatch, права — чтение.
name: browsers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-stand-browsers
  cancel-in-progress: false

jobs:
  browsers:
    name: Сценарии ролей в браузерах
    runs-on: [self-hosted, home-stand]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_HTML_OPEN: never
      LOGS_DIR: ${{ github.workspace }}/stand-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Убрать остатки прошлого прогона
        run: deploy/home-stand/e2e-stand.sh cleanup

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Собрать образы и поднять стенд (make up-test)
        timeout-minutes: 40
        run: deploy/home-stand/e2e-stand.sh up

      - name: Установить Playwright, Chromium и Firefox; найти браузеры системы
        id: found
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium firefox
          ../deploy/home-stand/e2e-stand.sh check-browser
          list="chromium,firefox"
          note() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          note "### Браузеры QA-023"
          if [[ -x /opt/google/chrome/chrome ]]; then list+=",chrome"; note "- Chrome: $(/opt/google/chrome/chrome --version)"
          else note "- Chrome: не установлен на стенде"; fi
          if [[ -x /opt/microsoft/msedge/msedge ]]; then list+=",msedge"; note "- Edge: $(/opt/microsoft/msedge/msedge --version)"
          else note "- Edge: не установлен на стенде"; fi
          yandex="$(command -v yandex-browser || command -v yandex-browser-stable || true)"
          if [[ -n "$yandex" ]]; then list+=",yandex"; note "- Яндекс Браузер: $("$yandex" --version)"
          else note "- Яндекс Браузер: не установлен на стенде"; fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "yandex=$yandex" >> "$GITHUB_OUTPUT"

      - name: Сценарии ролей в каждом браузере, экран 1366×768
        working-directory: e2e
        env:
          E2E_BROWSERS: ${{ steps.found.outputs.list }}
          E2E_YANDEX_PATH: ${{ steps.found.outputs.yandex }}
        run: |
          source <(../deploy/home-stand/e2e-stand.sh seed-env)
          npx playwright test --reporter=list,html

      - name: Собрать логи стенда
        if: always()
        run: deploy/home-stand/e2e-stand.sh logs

      - name: Отчёт Playwright, трассы и скриншоты
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browsers-report-${{ github.run_number }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            stand-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Остановить и почистить стенд
        if: always()
        run: deploy/home-stand/e2e-stand.sh cleanup
