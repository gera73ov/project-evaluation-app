# QA-023 · совместимость браузеров и экранов (NFR-COMP-01, NFR-COMP-02, FR-UI-03) на домашнем
# стенде, только запуском вручную. Поднимает стенд профиля test тем же скриптом, что e2e-stand, и
# гоняет сквозные сценарии ролей (e2e/scenarios, QA-018) в каждом браузере на экране 1366×768:
# Chromium и Firefox из Playwright и Chrome, установленный на машине стенда (без sudo его не
# поставить: команда — в ошибке шага). Edge и Яндекс Браузер не проверяются: в компании ими не
# пользуются (решение владельца продукта 12.11.2026).
# Правила безопасности те же, что у e2e-stand.yml: только workflow_dispatch, права — чтение.
name: browsers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-stand-browsers
  cancel-in-progress: false

jobs:
  browsers:
    name: Сценарии ролей в браузерах
    runs-on: [self-hosted, home-stand]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_HTML_OPEN: never
      LOGS_DIR: ${{ github.workspace }}/stand-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Убрать остатки прошлого прогона
        run: deploy/home-stand/e2e-stand.sh cleanup

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Собрать образы и поднять стенд (make up-test)
        timeout-minutes: 40
        run: deploy/home-stand/e2e-stand.sh up

      - name: Установить Playwright, Chromium и Firefox; проверить Chrome
        id: found
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium firefox
          ../deploy/home-stand/e2e-stand.sh check-browser
          list="chromium,firefox,chrome"
          note() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          note "### Браузеры QA-023"
          if [[ ! -x /opt/google/chrome/chrome ]]; then
            echo "::error::Chrome не установлен на стенде. Из своей учётки (не stand): wget -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb && sudo apt install -y /tmp/chrome.deb"
            exit 1
          fi
          note "- Chrome: $(/opt/google/chrome/chrome --version)"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Сценарии ролей в каждом браузере, экран 1366×768
        working-directory: e2e
        env:
          E2E_BROWSERS: ${{ steps.found.outputs.list }}
        run: |
          source <(../deploy/home-stand/e2e-stand.sh seed-env)
          npx playwright test --reporter=list,html

      - name: Собрать логи стенда
        if: always()
        run: deploy/home-stand/e2e-stand.sh logs

      - name: Отчёт Playwright, трассы и скриншоты
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browsers-report-${{ github.run_number }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
            stand-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Остановить и почистить стенд
        if: always()
        run: deploy/home-stand/e2e-stand.sh cleanup
